<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ace Homepage prototype: agent-driven Amplify Home</title>
<style>
/* Design tokens: tokens/css (primitives → semantic → components + typography + elevation) */
/*TOKENS*/
/* ats-ui component CSS (components/projects/ats-ui/src/lib), unchanged */
/*COMPONENTS*/
/* Novo icon set (ats-ui/assets/icons), as icon masks */
/*ICONS*/

/* ===== Prototype layer: layout + the new pieces. Tokens only. ===== */
html, body { margin: 0; height: 100%; }
body { font-family: var(--typography-font-family-base), 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--color-text-body);
  font-size: var(--typography-body-default-font-size); line-height: var(--typography-body-default-line-height); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Amplify radial on glyphs (same stops as ats-ui chat-block identity / bowling alley glyph) */
.ats-icon.amp-glyph { background: radial-gradient(circle at 14% 12%, #37fc97 0%, #a5f7d0 0.01%, #23afdc 47%, #09a0de 56%, #009bdf 65%, #125783 97%); }

/* Bowling alley: Amplify becomes a split tab (page + "next" opener for the Amplify menu) */
.ba-split { display: flex; align-items: center; border-radius: var(--bowling-alley-border-tabs-radius); }
.ba-split > .ats-bowling-alley-tab { flex: 1 1 auto; }
.ba-split.is-active, .ba-split:hover { background: var(--bowling-alley-color-tab-items-background-hover); }
.ba-split.is-active > .ats-bowling-alley-tab { background: transparent; }
.ba-split.is-active { background: var(--bowling-alley-color-tab-items-background-active); }
.ba-split > .ats-bowling-alley-tab:hover { background: transparent; }
.ba-next { flex: 0 0 auto; width: 24px; height: 24px; margin-right: var(--spacing-4); border: 0; padding: 0; background: transparent; cursor: pointer;
  display: none; align-items: center; justify-content: center; border-radius: var(--border-radius-xsm); }
.ba-next:hover, .ba-next[aria-expanded="true"] { background: var(--bowling-alley-color-tab-items-background-hover); }
.ba-next:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ba-next { display: flex; }
.ats-bowling-alley-shell[data-nav="collapsed"] .ba-split { justify-content: center; }
.ats-bowling-alley-shell[data-nav="collapsed"] .ba-split > .ats-bowling-alley-tab { flex: 0 0 auto; }

/* Amplify menu: existing dropdown-card + menu-option, 8px right of the opener (Figma overlay positioning) */
.amp-menu { position: absolute; z-index: 70; width: 248px; }
.amp-menu .ats-menu-option[aria-current="page"] { background: var(--bowling-alley-color-tab-items-background-active); }
.amp-menu .ats-menu-option[aria-current="page"] .ats-menu-option__label { font-weight: var(--typography-body-default-font-weight-medium); }
.amp-menu__sep { height: 1px; background: var(--color-border-subtle); margin: var(--spacing-4) 0; }
.amp-menu__meta { margin-left: auto; color: var(--color-text-subtle); font-size: var(--typography-meta-default-font-size); line-height: var(--typography-meta-default-line-height); }

/* ===== Amplify page ===== */
.amp-shell { display: flex; height: 100%; min-height: 0; position: relative; isolation: isolate; }
.amp { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; height: 100%; min-height: 0; }
/* Header: full-page header surface/tokens, one row. Breadcrumb replaces title + tabs. */
.amp-header { flex: 0 0 auto; display: flex; align-items: center; gap: var(--card-spacing-header-gap); position: relative; z-index: 2;
  padding: var(--spacing-padding-md) var(--header-spacing-padding-horizontal);
  background: var(--card-color-background-header); border-bottom: 1px solid var(--header-color-border-default); box-shadow: var(--elevation-2); }
.crumbs { display: flex; align-items: center; gap: var(--spacing-gap-sm); flex: 1 1 auto; min-width: 0; margin: 0; padding: 0; list-style: none; }
.crumbs li { display: flex; align-items: center; gap: var(--spacing-gap-sm); min-width: 0; }
.crumb-link { border: 0; background: transparent; padding: var(--spacing-4); margin: calc(var(--spacing-4) * -1); border-radius: var(--border-radius-xsm); cursor: pointer;
  color: var(--color-text-secondary); font-size: var(--typography-title-small-font-size); line-height: var(--typography-title-small-line-height); font-weight: var(--typography-title-small-font-weight); }
.crumb-link:hover { color: var(--color-text-link); }
.crumb-link:focus-visible { outline: 2px solid var(--color-border-focus); }
.crumb-sep { color: var(--color-text-subtle); font-size: var(--typography-title-small-font-size); line-height: var(--typography-title-small-line-height); }
.crumb-current { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-headline);
  font-size: var(--typography-title-small-font-size); line-height: var(--typography-title-small-line-height); font-weight: var(--typography-title-small-font-weight); }
.amp-header__actions { display: flex; align-items: center; gap: var(--header-spacing-candidate-header-actions); flex: 0 0 auto; }
.ats-btn.is-on { background: var(--color-background-hover); }
#hdrChats { position: relative; }
.hdr-badge { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 var(--spacing-4); box-sizing: border-box; border-radius: var(--border-radius-round);
  display: inline-flex; align-items: center; justify-content: center; background: var(--color-icon-utility-positive); color: var(--color-text-body-knockout);
  box-shadow: 0 0 0 2px var(--color-background-default);
  font-size: var(--typography-meta-small-font-size); line-height: var(--typography-meta-small-line-height); font-weight: var(--typography-body-sm-font-weight-medium); }

.amp-body { flex: 1 1 auto; min-height: 0; display: flex; position: relative; background: var(--color-background-muted); }
.amp-main { flex: 1 1 auto; min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; }
.page { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.page-inner { max-width: 1040px; margin: 0 auto; padding: var(--spacing-32) var(--spacing-margin) var(--spacing-48); display: flex; flex-direction: column; gap: var(--spacing-32); }

/* Chats panel: right slideout surface (level 3 - right) */
.chats { flex: 0 0 320px; width: 320px; height: 100%; position: relative; z-index: 3; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box;
  background: var(--color-background-default); border-left: 1px solid var(--color-border-subtle); box-shadow: var(--elevation-3-right); }
.chats__top { display: flex; flex-direction: column; gap: var(--spacing-gap-sm); padding: var(--spacing-16); border-bottom: 1px solid var(--color-border-subtle); }
.chats__title-row { display: flex; align-items: center; justify-content: space-between; min-height: 32px; }
.chats__title { margin: 0; color: var(--color-text-headline); font-size: var(--typography-body-default-font-size); line-height: var(--typography-body-default-line-height); font-weight: var(--typography-title-small-font-weight); }
.chats__list { flex: 1 1 auto; overflow-y: auto; padding: var(--spacing-8); display: flex; flex-direction: column; gap: var(--spacing-16); }
.chats__group { display: flex; flex-direction: column; gap: var(--spacing-2); }
.chats__label { padding: var(--spacing-4) var(--spacing-8); color: var(--color-text-subtle); text-transform: uppercase;
  font-size: var(--typography-input-label-sm-font-size); line-height: var(--typography-input-label-sm-line-height); font-weight: var(--typography-input-label-sm-font-weight); letter-spacing: var(--typography-input-label-sm-letter-spacing); }
.chat-item { display: flex; align-items: center; gap: var(--spacing-8); width: 100%; box-sizing: border-box; border: 0; background: transparent; cursor: pointer; text-align: left;
  padding: var(--spacing-8); border-radius: var(--bowling-alley-border-tabs-radius); color: var(--color-text-body); }
.chat-item:hover { background: var(--bowling-alley-color-tab-items-background-hover); }
.chat-item[aria-current="page"] { background: var(--bowling-alley-color-tab-items-background-active); }
.chat-item[aria-current="page"] .chat-item__t { font-weight: var(--typography-body-default-font-weight-medium); color: var(--color-text-headline); }
.chat-item:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
.chat-item__t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item__m { flex: 0 0 auto; color: var(--color-text-subtle); font-size: var(--typography-meta-default-font-size); line-height: var(--typography-meta-default-line-height); }
/* Chat items: bordered containers (card border + radius sm), title / description / context + last activity */
@media (max-width: 1100px) { .chats { position: absolute; top: 0; right: 0; bottom: 0; z-index: 3; } }
.chats__title-acts, .chats__gacts { display: flex; align-items: center; gap: var(--spacing-4); }
.chats__ghead { display: flex; align-items: center; justify-content: space-between; min-height: 32px; padding-right: var(--spacing-4); }
.chats__count { margin-left: var(--spacing-4); color: var(--color-text-subtle); }
.chats__list { padding: var(--spacing-8) var(--spacing-16) var(--spacing-16); }
.ci-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--spacing-8); }
.ci { display: flex; flex-direction: column; gap: var(--spacing-4); width: 100%; box-sizing: border-box; margin: 0; cursor: pointer; text-align: left;
  padding: var(--spacing-12); background: var(--color-background-default); color: var(--color-text-body);
  border: 1px solid var(--color-border-subtle); border-radius: var(--border-radius-sm);
  transition: border-color .12s ease, background-color .12s ease; }
.ci:hover { border-color: var(--color-border-default); background: var(--color-background-subtle); }
.ci[aria-current="page"] { border-color: var(--color-border-utility-positive); background: var(--color-background-hover); }
.ci:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 1px; }
.ci__top { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-8); min-width: 0; }
.ci__top .ci__ago { color: var(--color-text-subtle); font-size: var(--typography-meta-default-font-size); line-height: var(--typography-meta-default-line-height); }
.ci__dot { display: inline-block; width: 8px; height: 8px; margin-right: var(--spacing-8); border-radius: var(--border-radius-round); background: var(--color-icon-utility-positive); vertical-align: 1px; }
.ci__t { min-width: 0; color: var(--color-text-headline); font-weight: var(--typography-body-default-font-weight-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci__d { color: var(--color-text-secondary); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci__f { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-8); margin-top: var(--spacing-2);
  color: var(--color-text-subtle); font-size: var(--typography-meta-default-font-size); line-height: var(--typography-meta-default-line-height); }
.ci__ctx, .ci__st { display: inline-flex; align-items: center; gap: var(--spacing-4); min-width: 0; }
.ci__ctx > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci__ago, .ci__st { flex: 0 0 auto; white-space: nowrap; }
.ci__st--attention { color: var(--color-text-body); }
.chats__more { align-self: flex-start; margin-top: var(--spacing-8); border: 0; background: transparent; padding: 0; cursor: pointer; color: var(--color-text-link);
  font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); font-weight: var(--typography-body-sm-font-weight-medium); }
.chats__more:hover { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { .ci { transition: none; } }
.chats__empty { padding: var(--spacing-8); color: var(--color-text-subtle); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); }
</style>
<style>
/* view wrapper */
.amp-view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
/* shared text roles */
.h-sec { margin: 0; color: var(--color-text-headline); font-size: var(--typography-title-small-font-size); line-height: var(--typography-title-small-line-height); font-weight: var(--typography-title-small-font-weight); }
.t-meta { color: var(--color-text-subtle); font-size: var(--typography-meta-default-font-size); line-height: var(--typography-meta-default-line-height); }
.t-sm { font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); }
.t-sec { color: var(--color-text-secondary); }
.t-strong { color: var(--color-text-headline); font-weight: var(--typography-body-default-font-weight-medium); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-8); }

/* ===== Home (left-aligned greeting, ask box + to-dos | need to know + today) ===== */
.ats-checkbox { --ats-checkbox-check: var(--ats-icon); }
.home { max-width: 1120px; gap: var(--spacing-24); }
.home-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-24); }
.home-eyebrow { margin: 0 0 var(--spacing-4); color: var(--color-text-subtle); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); }
.home-greet { margin: 0; max-width: 640px; color: var(--color-text-headline); font-size: var(--typography-title-default-font-size); line-height: var(--typography-title-default-line-height); font-weight: var(--typography-title-default-font-weight); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: var(--spacing-32); align-items: start; }
@media (max-width: 1000px) { .home-grid { grid-template-columns: 1fr; } }
.home-col { display: flex; flex-direction: column; gap: var(--spacing-24); min-width: 0; }
.home-sec { display: flex; flex-direction: column; gap: var(--spacing-8); }
.home-label { margin: 0; color: var(--color-text-subtle); text-transform: uppercase;
  font-size: var(--typography-input-label-sm-font-size); line-height: var(--typography-input-label-sm-line-height); font-weight: var(--typography-input-label-sm-font-weight); letter-spacing: var(--typography-input-label-sm-letter-spacing); }
.todos, .sugs, .know, .agenda { list-style: none; margin: 0; padding: 0; }
.todo { display: flex; align-items: flex-start; gap: var(--spacing-12); padding: var(--spacing-12) 0; }
.todo + .todo { border-top: 1px solid var(--color-border-subtle); }
.todo .ats-checkbox { margin-top: var(--spacing-2); }
.todo__body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.todo__t { color: var(--color-text-headline); }
.todo__s { color: var(--color-text-subtle); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); }
.todo.is-done .todo__t { color: var(--color-text-subtle); text-decoration: line-through; }
.sug { display: flex; align-items: center; gap: var(--spacing-12); width: 100%; box-sizing: border-box; margin: 0; padding: var(--spacing-8); border: 0; background: transparent;
  border-radius: var(--border-radius-sm); cursor: pointer; text-align: left; color: var(--color-text-body); }
.sug:hover { background: var(--color-background-subtle); }
.sug:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
.sug__t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sug__go { display: inline-flex; align-items: center; gap: var(--spacing-4); color: var(--color-text-link); font-size: var(--typography-body-sm-font-size); font-weight: var(--typography-body-sm-font-weight-medium); opacity: 0; }
.sug:hover .sug__go, .sug:focus-visible .sug__go { opacity: 1; }
.home-card .ats-card__header { padding: var(--spacing-12) var(--spacing-16); }
.home-card .ats-card__title-text { font-size: var(--typography-body-default-font-size); line-height: var(--typography-body-default-line-height); text-transform: none; }
.know li { padding: var(--spacing-12) var(--spacing-16); display: flex; flex-direction: column; gap: var(--spacing-4); }
.know li + li { border-top: 1px solid var(--color-border-subtle); }
.know p { margin: 0; }
.know b { color: var(--color-text-headline); font-weight: var(--typography-body-default-font-weight-medium); }
.know .chats__more { margin-top: 0; }
.day-nav { display: flex; gap: var(--spacing-4); }
.agenda li { display: flex; gap: var(--spacing-12); padding: var(--spacing-8) var(--spacing-16); }
.agenda li:first-child { padding-top: var(--spacing-12); } .agenda li:last-child { padding-bottom: var(--spacing-16); }
.agenda__time { flex: 0 0 64px; color: var(--color-text-subtle); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-default-line-height); }
.agenda__ev { flex: 1 1 auto; display: flex; flex-direction: column; padding-left: var(--spacing-12); border-left: 2px solid var(--color-border-utility-positive); }
@media (prefers-reduced-motion: no-preference) { .sug__go { transition: opacity .12s ease; } }

/* ===== Chat ===== */
.chat-view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
.chat-view .ats-amplify-chat-conversation { flex: 1 1 auto; min-height: 0; }
.chat-view .ats-amplify-chat-conversation__input { padding-bottom: var(--spacing-24); padding-top: var(--spacing-8); }
.chat-start { position: absolute; inset: 0; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; box-sizing: border-box;
  padding: min(200px, 20vh) var(--spacing-margin) var(--spacing-margin); }
.chat-start > .ats-amplify-chat-global-chat-container { max-width: 750px; }
.starters { list-style: none; margin: var(--spacing-8) 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-12); }
@media (max-width: 700px) { .starters { grid-template-columns: 1fr; } }
.starters li { display: flex; }
.starter { display: flex; align-items: flex-start; gap: var(--spacing-12); width: 100%; box-sizing: border-box; margin: 0; padding: var(--spacing-16); cursor: pointer; text-align: left;
  background: var(--card-color-background-contents); border: 1px solid var(--color-border-subtle); border-radius: var(--border-radius-sm); box-shadow: var(--elevation-1); color: var(--color-text-body);
  transition: border-color .12s ease, box-shadow .12s ease; }
.starter:hover { border-color: var(--color-border-default); box-shadow: var(--elevation-2); }
.starter:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 1px; }
.starter__body { display: flex; flex-direction: column; gap: var(--spacing-2); min-width: 0; }
.starter__t { color: var(--color-text-headline); font-weight: var(--typography-body-default-font-weight-medium); }
.starter__d { color: var(--color-text-secondary); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); }
@media (prefers-reduced-motion: reduce) { .starter { transition: none; } }
.chat-start__hint { display: flex; flex-wrap: wrap; gap: var(--spacing-8); margin-top: var(--spacing-16); }
.ats-amplify-chat-user-turn { display: flex; justify-content: flex-end; }

/* Scheduled run inside a chat: the chat-block, plus one meta line. No extra container. */
.run-meta { display: flex; align-items: center; gap: var(--spacing-8); flex-wrap: wrap; }
.run-list { margin: 0; padding-left: var(--spacing-24); display: flex; flex-direction: column; gap: var(--spacing-4); }
.rec-link { color: var(--color-text-link); text-decoration: none; font-weight: var(--typography-body-default-font-weight-medium); }
.rec-link:hover { text-decoration: underline; }

/* Schedule card: one card for create + edit (ats-card surface) */
.sched-card { max-width: 560px; }
/* Every card in a chat reply: one width (the chat column, capped) */
.ats-amplify-chat-chat-block__body > .ats-card, .ats-amplify-chat-chat-block__body > .sched-card { width: 100%; max-width: 640px; box-sizing: border-box; }
.sched-card .ats-card__header { padding: var(--spacing-12) var(--spacing-16); }
.sched-card .ats-card__title-text { font-size: var(--typography-body-default-font-size); line-height: var(--typography-body-default-line-height); text-transform: none; }
.sf { display: grid; grid-template-columns: 96px 1fr; gap: var(--spacing-12) var(--spacing-16); align-items: center; padding: var(--spacing-16); }
.sf label, .sf .sf-l { color: var(--field-color-content-label); font-size: var(--typography-input-label-field-label-font-size); line-height: var(--typography-input-label-field-label-line-height); font-weight: var(--typography-input-label-field-label-font-weight); }
.sf .sf-v { color: var(--color-text-body); }
.sf-row { display: flex; gap: var(--spacing-8); flex-wrap: wrap; }
.fld { box-sizing: border-box; min-height: var(--field-min-height); padding: var(--field-spacing-padding-vertical) var(--field-spacing-padding-horizontal);
  border: var(--field-border-width-default) solid var(--field-color-border-default); border-radius: var(--field-border-radius-default);
  background: var(--field-color-background-default); color: var(--field-color-content-value); font: inherit; }
.fld:hover { border-color: var(--field-color-border-hover); }
.fld:focus { outline: none; border-color: var(--field-color-border-focus); box-shadow: inset 0 0 0 1px var(--field-color-border-focus); }
input.fld[type="text"] { width: 100%; }
.sf-access { display: flex; gap: var(--spacing-8); align-items: center; padding: 0 var(--spacing-16) var(--spacing-16); color: var(--color-text-subtle); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); }
.sched-card__foot { display: flex; justify-content: flex-end; gap: var(--spacing-8); padding: var(--spacing-12) var(--spacing-16); border-top: 1px solid var(--color-border-subtle); }
.sched-done { display: flex; align-items: center; gap: var(--spacing-8); flex-wrap: wrap; }

/* Confirmation + run cards in chat */
.sched-confirm { gap: var(--spacing-4); }

.run-card .ats-card__header { padding: var(--spacing-12) var(--spacing-16); }
.run-card .ats-card__title-text, .sched-card .ats-card__title-text { font-size: var(--typography-body-default-font-size); line-height: var(--typography-body-default-line-height); text-transform: none; }
.run-card .ats-card__title-text { overflow: hidden; text-overflow: ellipsis; }
.run-card .ats-card__header > .t-meta { flex: 0 0 auto; }

/* Run output format B: digest */
.digest { display: flex; flex-direction: column; gap: var(--spacing-12); padding: var(--spacing-12) var(--spacing-16) var(--spacing-16); }

  background: var(--color-background-subtle); border: 1px solid var(--color-border-subtle); border-radius: var(--border-radius-sm); }

.digest__fork { opacity: .6; } .digest__list li:hover .digest__fork, .digest__fork:focus-visible { opacity: 1; }
/* Run output format C: compact table */
.rt { margin: 0 var(--spacing-16) var(--spacing-16); border: 1px solid var(--color-border-subtle); border-radius: var(--border-radius-sm); overflow: hidden; }
.rt__row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) auto; gap: var(--spacing-12); align-items: center; padding: var(--spacing-8) var(--spacing-12); }
.rt__row + .rt__row { border-top: 1px solid var(--color-border-subtle); }
.rt__head { background: var(--color-background-subtle); color: var(--color-text-subtle); text-transform: uppercase;
  font-size: var(--typography-input-label-sm-font-size); line-height: var(--typography-input-label-sm-line-height); font-weight: var(--typography-input-label-sm-font-weight); letter-spacing: var(--typography-input-label-sm-letter-spacing); }
.rt__rec { display: flex; align-items: center; gap: var(--spacing-8); min-width: 0; }
.rt__rec .rec-link { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rt__acts { display: flex; justify-content: flex-end; }
/* follow-ups under a reply */
.ats-amplify-chat-chat-block__follow-ups { display: flex; flex-wrap: wrap; gap: var(--spacing-8); }

/* ===== Scheduled page ===== */
.sp-list { list-style: none; margin: 0; padding: 0; }
.sp-card { --sp-cols: minmax(0, 1fr) 200px 152px 152px; }
.sp-row { display: grid; grid-template-columns: var(--sp-cols); gap: var(--spacing-16); align-items: center;
  padding: var(--spacing-16) var(--card-spacing-header-padding-horizontal); }
.sp-list > li + li { border-top: 1px solid var(--color-border-subtle); }

  font-size: var(--typography-body-default-font-size); line-height: var(--typography-body-default-line-height); font-weight: var(--typography-body-default-font-weight-medium); }
.sp-row__name:hover { color: var(--color-text-link); }
.sp-row__name:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; border-radius: var(--border-radius-xsm); }
.sp-row__acts { display: flex; align-items: center; gap: var(--spacing-8); justify-content: flex-end; position: relative; }
.sp-head { display: grid; grid-template-columns: var(--sp-cols); align-items: center; gap: var(--spacing-16); padding: var(--spacing-8) var(--card-spacing-header-padding-horizontal);
  border-bottom: 1px solid var(--color-border-subtle); color: var(--color-text-subtle); text-transform: uppercase;
  font-size: var(--typography-input-label-sm-font-size); line-height: var(--typography-input-label-sm-line-height); font-weight: var(--typography-input-label-sm-font-weight); letter-spacing: var(--typography-input-label-sm-letter-spacing); }
.sp-attn { grid-column: 1 / -1; display: flex; gap: var(--spacing-8); align-items: center; flex-wrap: wrap; margin-top: calc(var(--spacing-8) * -1); }
.sp-edit { padding: 0 var(--card-spacing-header-padding-horizontal) var(--spacing-16); }
.sp-edit .sched-card { max-width: none; box-shadow: none; }
.row-menu { position: absolute; right: 0; top: calc(100% + var(--spacing-4)); z-index: 5; width: 176px; }

@media (max-width: 900px) { .sp-row { grid-template-columns: minmax(0, 1fr) auto; } .sp-head { display: none; } .sp-row > :nth-child(2) { grid-column: 1; } .sp-row > :nth-child(3) { grid-column: 1; } .sp-row__acts { grid-row: 1; grid-column: 2; } }
.sp-empty { padding: var(--spacing-32) var(--card-spacing-header-padding-horizontal); text-align: center; color: var(--color-text-secondary); }

/* ===== Prototype guide (demo tooling, not product UI) ===== */
.guide { position: fixed; right: var(--spacing-16); top: 72px; z-index: 95; font-family: inherit; }

.guide__link:hover { background: var(--color-background-hover); }

.guide__link b { color: var(--color-text-link); font-weight: var(--typography-body-sm-font-weight-medium); font-size: var(--typography-body-sm-font-size); line-height: var(--typography-body-sm-line-height); }

  background: var(--color-text-body); color: var(--color-background-default); border-radius: var(--border-radius-sm); padding: var(--spacing-8) var(--spacing-16); box-shadow: var(--elevation-4); }
