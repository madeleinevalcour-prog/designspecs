<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Prospect tab mockup</title>
<style>
/*TOKENS*/
/*COMPONENTS*/
/*ICONS*/
/*PAGE_CSS*/
</style>
</head>
<body>
<!-- icons used: data-i="bull" data-i="contract-left" data-i="expand-right" data-i="search" data-i="menu-outline" data-i="add-thin" data-i="next" data-i="amplify" data-i="company-list" data-i="company" data-i="pin" data-i="pin-outline" data-i="close" data-i="resume" data-i="question" data-i="shield-outline" data-i="link" data-i="refresh-outline" data-i="chevron-down" data-i="layout" data-i="check" data-i="google" data-i="location" data-i="location-outline" data-i="print" data-i="linkedin" data-i="twitter" data-i="users" data-i="calendar" data-i="globe-outline" data-i="star-o" data-i="trending-down" data-i="delete-outline" data-i="arrow-right" data-i="caution" data-i="external-open" data-i="info-outline" data-i="trending-up" data-i="rate-circle" data-i="email" data-i="circle" data-i="job" data-i="add-thin" data-i="link" -->
<div class="ats-bowling-alley-shell" id="shell" data-nav="open">
  <div class="ats-bowling-alley-shell__stage" id="stage">
    <nav class="ats-bowling-alley" aria-label="Main">
      <div class="ats-bowling-alley__card">
        <div class="ats-bowling-alley__head">
          <div class="ats-bowling-alley__logo">
            <span class="ats-bowling-alley__wordmark">Bullhorn</span>
            <span class="ats-icon" data-i="bull" style="width:24px;height:24px;background-color:var(--bowling-alley-color-logo-icon)"></span>
          </div>
          <button class="ats-bowling-alley__toggle" type="button" id="navToggle" aria-label="Collapse menu" aria-expanded="true">
            <span class="ats-icon" data-i="contract-left" id="navToggleIcon" style="width:14px;height:14px;background-color:var(--bowling-alley-color-content-icon-default)"></span>
          </button>
        </div>
        <div class="ats-bowling-alley__tabs">
          <div class="ats-main-tabs ats-bowling-alley__section" id="mainTabs"></div>
          <div class="ats-bowling-alley-divider">
            <span class="ats-bowling-alley-divider__line"></span>
            <button class="ats-bowling-alley-divider__clear" type="button" data-clear-tabs><span>Clear All</span><span class="ats-icon" data-i="close" aria-hidden="true" style="width:12px;height:12px;background-color:var(--color-icon-subtle)"></span></button>
          </div>
          <div class="ats-bowling-alley__section" id="entTabs"></div>
        </div>
        <div class="ats-bowling-alley__foot">
          <button class="ats-bowling-alley__parse" type="button">
            <span class="ats-bowling-alley-tab__icon"><span class="ats-icon" data-i="resume" style="width:14px;height:14px;background-color:var(--bowling-alley-color-content-icon-default)"></span></span>
            <span class="ats-bowling-alley-tab__label">Parse Resume</span>
          </button>
          <div class="ats-bowling-alley__foot-actions">
            <button class="ats-bowling-alley-foot-item ats-bowling-alley-foot-item--utility" type="button" aria-label="Help">
              <span class="ats-bowling-alley-tab__icon"><span class="ats-icon" data-i="question" style="width:16px;height:16px;background-color:var(--bowling-alley-color-content-icon-default)"></span></span>
              <span class="ats-bowling-alley-tab__label">Help</span>
            </button>
            <button class="ats-bowling-alley-foot-item ats-bowling-alley-foot-item--utility" type="button" aria-label="Privacy">
              <span class="ats-bowling-alley-tab__icon"><span class="ats-icon" data-i="shield-outline" style="width:16px;height:16px;background-color:var(--bowling-alley-color-content-icon-default)"></span></span>
              <span class="ats-bowling-alley-tab__label">Privacy</span>
            </button>
            <button class="ats-bowling-alley-foot-item ats-bowling-alley-foot-item--user" type="button" aria-label="Chloe Davis">
              <span class="ats-bowling-alley-tab__icon"><span class="ats-bowling-alley__avatar">CD</span></span>
              <span class="ats-bowling-alley-tab__label">Chloe Davis</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
    <div class="ats-tooltip ats-bowling-alley-shell__tooltip" id="tip" role="tooltip" hidden><span class="ats-tooltip__arrow"></span><div class="ats-tooltip__box"></div></div>
    <div class="ats-bowling-alley-shell__main">
      <div class="ats-bowling-alley-shell__canvas">
        <div class="page" id="page">
          <header class="ats-rh" id="rh"></header>
          <main class="body" id="body" aria-label="Prospect"></main>
        </div>
        <section class="so is-off" id="so" role="dialog" aria-modal="false" aria-labelledby="soTitle"></section>
      </div>
    </div>
  </div>
</div>
<script>
/*SCRIPT*/
</script>
</body>
</html>
