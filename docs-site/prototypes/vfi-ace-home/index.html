/* =====================================================================
   ELEVATION — captured from Figma (Component-Migration effect styles, node
   918:13883). NOT auto-generated — update by hand if the styles change.
   Shadows reference spacing/* (offsets + blur) and the charcoal transparency
   primitives, which vary by grayscale mode — so elevations follow data-core-mode.
   Level 4 additionally uses a 4px background blur (apply backdrop-filter too).
   ===================================================================== */
:root {
  /* general/level 1 (== button/default) */
  --elevation-1: 0 var(--spacing-2) var(--spacing-4) 0 var(--color-transparency-charcoal-charcoal-04);
  /* general/level 2 */
  --elevation-2: 0 var(--spacing-4) var(--spacing-8) 0 var(--color-transparency-charcoal-charcoal-08);
  /* general/level 3 */
  --elevation-3: 0 var(--spacing-4) var(--spacing-8) 0 var(--color-transparency-charcoal-charcoal-08),
                 var(--spacing-2) var(--spacing-4) var(--spacing-8) 0 var(--color-transparency-charcoal-charcoal-04);
  /* general/level 3 - right (shadow biased to the left edge, for right-anchored panels) */
  --elevation-3-right: 0 var(--spacing-4) var(--spacing-8) 0 var(--color-transparency-charcoal-charcoal-08),
                       -2px var(--spacing-4) var(--spacing-8) 0 var(--color-transparency-charcoal-charcoal-04);
  /* general/level 4 (also: backdrop-filter: blur(var(--elevation-4-blur))) */
  --elevation-4: 0 var(--spacing-4) var(--spacing-8) 0 var(--color-transparency-charcoal-charcoal-08),
                 var(--spacing-8) var(--spacing-12) var(--spacing-16) 0 var(--color-transparency-charcoal-charcoal-08);
  --elevation-4-blur: 4px;

  /* button states */
  --elevation-button-default: var(--elevation-1);
  --elevation-button-hover: 0 var(--spacing-2) var(--spacing-4) 0 var(--color-transparency-charcoal-charcoal-04),
                            var(--spacing-4) var(--spacing-8) var(--spacing-12) 0 var(--color-transparency-charcoal-charcoal-08);
  --elevation-button-active: 0 var(--spacing-2) var(--spacing-4) 0 var(--color-transparency-charcoal-charcoal-04),
                             var(--spacing-4) var(--spacing-8) var(--spacing-12) 0 var(--color-transparency-charcoal-charcoal-08),
                             inset 0 4px 8px 0 var(--color-transparency-charcoal-charcoal-08);
  --elevation-button-active-no-container: inset 0 4px 8px 0 var(--color-transparency-charcoal-charcoal-08);
}

/* ==== button/button.css ==== */
/* Button — Figma "Button" matrix (Component Migration 68:2694), ported from the
   prototype repo's Button.astro and wired to the Tier-3 button tokens
   (--button-color-<theme>[-<color>]-<background|content|border>-<state>).

   How it works: each theme / theme+color block below maps its tokens onto private
   --_* vars; the state rules only ever read those vars. A color with no token for a
   given slot falls back to the theme's default-color token.
   Unencapsulated so projected content (icons) can be styled; namespaced .ats-btn. */

.ats-btn {
  /* every private var is always defined (see CLAUDE.md: never transition a
     property whose var() can go unset) */
  --_bg: transparent; --_bg-hover: var(--_bg); --_bg-focus: var(--_bg-hover);
  --_bg-active: var(--_bg-hover); --_bg-disabled: var(--_bg);
  --_fg: currentColor; --_fg-hover: var(--_fg); --_fg-focus: var(--_fg-hover);
  --_fg-active: var(--_fg-hover); --_fg-disabled: var(--_fg);
  --_bd: transparent; --_bd-hover: var(--_bd); --_bd-active: var(--_bd-hover); --_bd-disabled: var(--_bd);
  --_ring: var(--color-border-focus, #4a89dc);
  --_sh: none; --_sh-hover: var(--_sh); --_sh-active: var(--_sh-hover);

  display: inline-flex; align-items: center; justify-content: center;
  box-sizing: border-box; position: relative; cursor: pointer; border: 0; margin: 0;
  text-decoration: none; white-space: nowrap;
  border-radius: var(--button-border-radius-default);
  background: var(--_bg); color: var(--_fg); box-shadow: var(--_sh);
  transition: background-color .12s ease, box-shadow .12s ease, color .12s ease;
}
.ats-btn img, .ats-btn svg, .ats-btn .ats-icon { display: block; flex: 0 0 auto; }
.ats-btn .ats-icon { background-color: currentColor; } /* icons follow the content token */

/* ==== icon-container/icon-container.css ==== */
/* icon-container (Figma Component Migration 164:17910). Fill = color/entity/*
   (bound in Figma), glyph = icon-container/icon, radius = border/radius/xsm (sm)
   or border/radius/sm (md, lg). Unencapsulated, namespaced .ats-icon-container. */

.ats-icon-container {
  display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center;
  box-sizing: border-box; vertical-align: middle;
  width: 24px; height: 24px; /* no token: Figma's fixed sm box */
  border-radius: var(--border-radius-xsm);
  background: var(--color-entity-job);
}
.ats-icon-container .ats-icon { display: block; flex: 0 0 auto; }

.ats-icon-container[data-size="md"] {
  width: 40px; height: 40px; /* no token: Figma's fixed md box */
  border-radius: var(--border-radius-sm);
}
.ats-icon-container[data-size="lg"] {
  width: 48px; height: 48px; /* no token: Figma's fixed lg box */
  border-radius: var(--border-radius-sm);
}

.ats-icon-container[data-theme="jobs"]        { background: var(--color-entity-job); }
.ats-icon-container[data-theme="candidate"]   { background: var(--color-entity-candidate); }
.ats-icon-container[data-theme="contact"]     { background: var(--color-entity-contact); }
.ats-icon-container[data-theme="company"]     { background: var(--color-entity-company); }
.ats-icon-container[data-theme="neutral"]     { background: var(--color-entity-note); }
.ats-icon-container[data-theme="opportunity"] { background: var(--color-entity-opportunity); }
.ats-icon-container[data-theme="lead"]        { background: var(--color-entity-lead); }
.ats-icon-container[data-theme="placement"]   { background: var(--color-entity-placement); }
.ats-icon-container[data-theme="submission"]  { background: var(--color-entity-submission); }
.ats-icon-container[data-theme="amplify"] {
  /* no token: Figma style "Amplify Radial" (same stops as the Amplify glyph elsewhere in ats-ui) */
  background: radial-gradient(circle at 14% 12%, #37fc97 0%, #a5f7d0 0.01%, #23afdc 47%, #09a0de 56%, #009bdf 65%, #125783 97%);
}

/* ==== icon-button-no-container/icon-button-no-container.css ==== */
/* Icon Button - no container — Figma 164:17717 (theme "Icon-no-container"), ported
   from the prototype repo's IconButtonNoContainer.astro.
   Size / padding / radius: --button-spacing-no-container-* + --button-border-radius-no-container.
   Colors: the Tier-3 icon-button tokens (--button-color-icon-*), except the resting
   and disabled backgrounds, which stay transparent ("no container").
   Unencapsulated so projected glyphs can be styled; namespaced .ats-icon-button-no-container. */

.ats-icon-button-no-container {
  width: var(--button-spacing-no-container-min-height);
  height: var(--button-spacing-no-container-min-height);
  padding: var(--button-spacing-no-container-padding-vertical) var(--button-spacing-no-container-padding-horizontal);
  box-sizing: border-box; margin: 0;
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  border: 0; background: transparent; cursor: pointer;
  border-radius: var(--button-border-radius-no-container);
  color: var(--button-color-icon-content-default);
  transition: background-color .12s ease;
}
.ats-icon-button-no-container img,
.ats-icon-button-no-container svg,
.ats-icon-button-no-container .ats-icon { display: block; width: 12px; height: 12px; flex: 0 0 auto; }
.ats-icon-button-no-container .ats-icon { background-color: currentColor; } /* glyph follows the content token */

.ats-icon-button-no-container:hover, .ats-icon-button-no-container.is-hover {
  background: var(--button-color-icon-background-hover); color: var(--button-color-icon-content-hover);
}
.ats-icon-button-no-container:active, .ats-icon-button-no-container.is-active {
  background: var(--button-color-icon-background-active); color: var(--button-color-icon-content-active);
}
.ats-icon-button-no-container:focus-visible, .ats-icon-button-no-container.is-focus {
  background: var(--button-color-icon-background-focus); color: var(--button-color-icon-content-focus);
  outline: var(--button-border-width-focus) solid var(--button-color-icon-border-focus);
  outline-offset: calc(var(--button-border-width-focus) * -1);
}
.ats-icon-button-no-container:disabled {
  background: transparent; color: var(--button-color-icon-content-disabled);
  outline: 0; cursor: not-allowed;
}

/* ==== novo-chip/novo-chip.css ==== */
/* novo-chip (Figma Component Migration 157:2949, panel 45:445). Every value is the
   Tier-3 chip/* token Figma binds; typography meta/sm | meta/default | meta/large.
   Figma strokes are inside the box, so the border is an inset box-shadow (a 2px
   focus stroke doesn't change the chip's size). Unencapsulated, .ats-novo-chip. */

.ats-novo-chip {
  --_chip-bg: var(--chip-color-background-default-default);
  --_chip-border: var(--chip-color-border-default-default);
  --_chip-border-width: var(--chip-border-width);
  --_chip-fg: var(--chip-color-content-default-default);
  --_chip-label: var(--_chip-fg);
  --_chip-icon: var(--_chip-fg);
  display: inline-flex; align-items: center; flex: 0 0 auto; box-sizing: border-box; vertical-align: middle;
  gap: var(--chip-spacing-md-gap);
  min-height: var(--chip-spacing-xs-min-height);
  max-height: var(--chip-spacing-md-max-height);
  padding: var(--chip-spacing-md-padding-vertical) var(--chip-spacing-md-padding-horizontal);
  border-radius: var(--chip-border-radius);
  background: var(--_chip-bg);
  box-shadow: inset 0 0 0 var(--_chip-border-width) var(--_chip-border);
  color: var(--_chip-fg);
  font-family: var(--typography-meta-default-font-family), 'Inter', sans-serif;
  font-weight: var(--typography-meta-default-font-weight); font-size: var(--typography-meta-default-font-size);
  line-height: var(--typography-meta-default-line-height); letter-spacing: var(--typography-meta-default-letter-spacing);
}
.ats-novo-chip .ats-icon { display: block; flex: 0 0 auto; }
.ats-novo-chip__label { color: var(--_chip-label); white-space: nowrap; text-decoration: none; }
a.ats-novo-chip__label:focus { outline: none; }
.ats-novo-chip__remove {
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer;
  appearance: none; -webkit-appearance: none; color: inherit; border-radius: var(--chip-border-radius);
}
.ats-novo-chip__remove:focus { outline: none; }

/* ---- sizes ---- */
.ats-novo-chip[data-size="small"] {
  gap: var(--chip-spacing-sm-gap); min-height: 0; max-height: var(--chip-spacing-sm-max-height);
  padding: var(--chip-spacing-sm-padding-vertical) var(--chip-spacing-sm-padding-horizontal);
  font-family: var(--typography-meta-small-font-family), 'Inter', sans-serif;
  font-weight: var(--typography-meta-small-font-weight); font-size: var(--typography-meta-small-font-size);
  line-height: var(--typography-meta-small-line-height); letter-spacing: var(--typography-meta-small-letter-spacing);
}
.ats-novo-chip[data-size="large"] {
  max-height: var(--chip-spacing-lg-max-height); /* gap stays chip/spacing/md/gap, as Figma binds */
  padding: var(--chip-spacing-lg-padding-vertical) var(--chip-spacing-lg-padding-horizontal);
  font-family: var(--typography-meta-large-font-family), 'Inter', sans-serif;
  font-weight: var(--typography-meta-large-font-weight); font-size: var(--typography-meta-large-font-size);
  line-height: var(--typography-meta-large-line-height); letter-spacing: var(--typography-meta-large-letter-spacing);
}

/* ---- colors: default state ---- */
/* warning: border from chip/color/border/warning/* (Figma binds the stroke to the background token; the designer wants the border shown). */
.ats-novo-chip[data-color="default"] { --_chip-bg: var(--chip-color-background-default-default); --_chip-border: var(--chip-color-border-default-default); --_chip-fg: var(--chip-color-content-default-default); }
.ats-novo-chip[data-color="negative"] { --_chip-bg: var(--chip-color-background-negative-default); --_chip-border: var(--chip-color-border-negative-default); --_chip-fg: var(--chip-color-content-negative-default); }
.ats-novo-chip[data-color="warning"] { --_chip-bg: var(--chip-color-background-warning-default); --_chip-border: var(--chip-color-border-warning-default); --_chip-fg: var(--chip-color-content-warning-default); }
.ats-novo-chip[data-color="positive"] { --_chip-bg: var(--chip-color-background-positive-default); --_chip-border: var(--chip-color-border-positive-default); --_chip-fg: var(--chip-color-content-positive-default); }
.ats-novo-chip[data-color="success"] { --_chip-bg: var(--chip-color-background-success-default); --_chip-border: var(--chip-color-border-success-default); --_chip-fg: var(--chip-color-content-success-default); }

/* ---- hover (interactive chips, or forced) ---- */
.ats-novo-chip--interactive[data-color="default"]:hover,
.ats-novo-chip.is-hover[data-color="default"] {
  --_chip-bg: var(--chip-color-background-default-hover); --_chip-border: var(--chip-color-border-default-hover); --_chip-fg: var(--chip-color-content-default-hover);
}
.ats-novo-chip--interactive[data-color="negative"]:hover,
.ats-novo-chip.is-hover[data-color="negative"] {
  --_chip-bg: var(--chip-color-background-negative-hover); --_chip-border: var(--chip-color-border-negative-hover); --_chip-fg: var(--chip-color-content-negative-hover);
}
.ats-novo-chip--interactive[data-color="warning"]:hover,
.ats-novo-chip.is-hover[data-color="warning"] {
  --_chip-bg: var(--chip-color-background-warning-hover); --_chip-border: var(--chip-color-border-warning-hover); --_chip-fg: var(--chip-color-content-warning-hover);
}
.ats-novo-chip--interactive[data-color="positive"]:hover,
.ats-novo-chip.is-hover[data-color="positive"] {
  --_chip-bg: var(--chip-color-background-positive-hover); --_chip-border: var(--chip-color-border-positive-hover); --_chip-fg: var(--chip-color-content-positive-hover);
}
.ats-novo-chip--interactive[data-color="success"]:hover,
.ats-novo-chip.is-hover[data-color="success"] {
  --_chip-bg: var(--chip-color-background-success-hover); --_chip-border: var(--chip-color-border-success-hover); --_chip-fg: var(--chip-color-content-success-hover);
}

/* ---- focus: every color uses the default focus fill + stroke ---- */
.ats-novo-chip[data-color="default"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-color="default"] {
  --_chip-bg: var(--chip-color-background-default-focus); --_chip-border: var(--chip-color-border-default-focus);
  --_chip-border-width: var(--chip-border-focus-width); --_chip-fg: var(--chip-color-content-default-focus);
}
.ats-novo-chip[data-color="negative"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-color="negative"] {
  --_chip-bg: var(--chip-color-background-default-focus); --_chip-border: var(--chip-color-border-default-focus);
  --_chip-border-width: var(--chip-border-focus-width); --_chip-fg: var(--chip-color-content-negative-focus);
}
.ats-novo-chip[data-color="warning"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-color="warning"] {
  --_chip-bg: var(--chip-color-background-default-focus); --_chip-border: var(--chip-color-border-default-focus);
  --_chip-border-width: var(--chip-border-focus-width); --_chip-fg: var(--chip-color-content-warning-focus);
}
.ats-novo-chip[data-color="positive"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-color="positive"] {
  --_chip-bg: var(--chip-color-background-default-focus); --_chip-border: var(--chip-color-border-default-focus);
  --_chip-border-width: var(--chip-border-focus-width); --_chip-fg: var(--chip-color-content-positive-focus);
}
.ats-novo-chip[data-color="success"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-color="success"] {
  --_chip-bg: var(--chip-color-background-default-focus); --_chip-border: var(--chip-color-border-default-focus);
  --_chip-border-width: var(--chip-border-focus-width); --_chip-fg: var(--chip-color-content-success-focus);
}

/* ---- type=link: link-colored label; icons follow the label on colored chips ---- */
.ats-novo-chip[data-type="link"] { --_chip-icon: var(--_chip-label); }
.ats-novo-chip[data-type="link"][data-color="default"] { --_chip-label: var(--chip-color-content-default-link); }
.ats-novo-chip[data-type="link"][data-color="negative"] { --_chip-label: var(--chip-color-content-negative-link); }
.ats-novo-chip[data-type="link"][data-color="warning"] { --_chip-label: var(--chip-color-content-warning-link); }
.ats-novo-chip[data-type="link"][data-color="positive"] { --_chip-label: var(--chip-color-content-positive-link); }
.ats-novo-chip[data-type="link"][data-color="success"] { --_chip-label: var(--chip-color-content-success-link); }
.ats-novo-chip--interactive[data-type="link"][data-color="default"]:hover,
.ats-novo-chip.is-hover[data-type="link"][data-color="default"] { --_chip-label: var(--chip-color-content-default-link-hover); }
.ats-novo-chip--interactive[data-type="link"][data-color="negative"]:hover,
.ats-novo-chip.is-hover[data-type="link"][data-color="negative"] { --_chip-label: var(--chip-color-content-negative-link-hover); }
.ats-novo-chip--interactive[data-type="link"][data-color="warning"]:hover,
.ats-novo-chip.is-hover[data-type="link"][data-color="warning"] { --_chip-label: var(--chip-color-content-warning-link-hover); }
.ats-novo-chip--interactive[data-type="link"][data-color="positive"]:hover,
.ats-novo-chip.is-hover[data-type="link"][data-color="positive"] { --_chip-label: var(--chip-color-content-positive-link-hover); }
.ats-novo-chip--interactive[data-type="link"][data-color="success"]:hover,
.ats-novo-chip.is-hover[data-type="link"][data-color="success"] { --_chip-label: var(--chip-color-content-success-link-hover); }
.ats-novo-chip[data-type="link"][data-color="negative"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-type="link"][data-color="negative"] { --_chip-label: var(--_chip-fg); }
.ats-novo-chip[data-type="link"][data-color="warning"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-type="link"][data-color="warning"] { --_chip-label: var(--_chip-fg); }
.ats-novo-chip[data-type="link"][data-color="positive"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-type="link"][data-color="positive"] { --_chip-label: var(--_chip-fg); }
.ats-novo-chip[data-type="link"][data-color="success"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-type="link"][data-color="success"] { --_chip-label: var(--_chip-fg); }
/* default-color link: only the label reacts; fill, stroke and icons stay default
   (focus adds only the focus stroke). Figma leaves the focus label unbound
   (#1450a0), which is chip/color/content/default/link-hover. */
.ats-novo-chip[data-type="link"][data-color="default"] { --_chip-icon: var(--chip-color-content-default-default); }
.ats-novo-chip--interactive[data-type="link"][data-color="default"]:hover,
.ats-novo-chip.is-hover[data-type="link"][data-color="default"] {
  --_chip-bg: var(--chip-color-background-default-default); --_chip-border: var(--chip-color-border-default-default);
}
.ats-novo-chip[data-type="link"][data-color="default"]:has(:focus-visible),
.ats-novo-chip.is-focus[data-type="link"][data-color="default"] {
  --_chip-bg: var(--chip-color-background-default-default); --_chip-label: var(--chip-color-content-default-link-hover);
}

/* ==== search-input/search-input.css ==== */
/* search-input (Figma "search-input"). field = Fast Find (1323:67011); pill = Menu filter (1323:68245). */
.ats-search-input {
  display: flex; align-items: center; gap: var(--spacing-gap-sm); width: 100%; box-sizing: border-box;
  min-height: var(--spacing-32); padding: var(--spacing-4);

  border: var(--field-border-width-default) solid var(--field-color-border-default);
  border-radius: var(--field-border-radius-default);
  font-family: var(--typography-bowling-alley-main-nav-font-family), 'Inter', sans-serif;
  cursor: text;
}
.ats-search-input:hover { border-color: var(--field-color-border-hover); }
.ats-search-input.is-active,
.ats-search-input:focus-within { border-color: var(--field-color-border-focus); }

.ats-search-input__icon {
  flex: 0 0 auto; width: 24px; height: 24px; box-sizing: border-box; padding: var(--spacing-padding-xsm);
  display: flex; align-items: center; justify-content: center;
}
.ats-search-input__input {
  flex: 1 0 0; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; margin: 0;
  font-family: inherit;
  font-size: var(--typography-bowling-alley-main-nav-font-size);
  line-height: var(--typography-bowling-alley-main-nav-line-height);
  font-weight: var(--typography-bowling-alley-main-nav-font-weight);
  letter-spacing: var(--typography-bowling-alley-main-nav-letter-spacing);
  color: var(--field-color-content-value);
  -webkit-appearance: none; appearance: none;
}
.ats-search-input__input::placeholder { color: var(--field-color-content-placeholder); opacity: 1; }
.ats-search-input__input::-webkit-search-cancel-button { display: none; }

/* close: icon Button (min 32 × 32, radius button/border/radius/icon) */
.ats-search-input__close {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  min-width: 32px; min-height: 32px; margin: -4px 0; border: 0; padding: 0; background: transparent; cursor: pointer;
  border-radius: var(--button-border-radius-icon);
}
.ats-search-input__close:hover { background: var(--color-background-subtle); }
.ats-search-input__close:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }

/* ---- pill (Menu filter) ---- */
.ats-search-input--pill {
  min-height: var(--spacing-40); padding: var(--spacing-4) var(--spacing-16);
  border-color: var(--search-color-border-default); border-radius: var(--border-radius-round);
  font-family: var(--typography-input-value-default-font-family), 'Inter', sans-serif;
}
.ats-search-input--pill .ats-search-input__icon { width: auto; height: auto; padding: 0; }
.ats-search-input--pill:hover { border-color: var(--search-color-border-hover); }
.ats-search-input--pill.is-active,
.ats-search-input--pill:focus-within { border-color: var(--search-color-border-focus); }
.ats-search-input--pill .ats-search-input__input {
  height: 28px;
  font-size: var(--typography-input-value-default-font-size);
  line-height: var(--typography-input-value-default-line-height);
  font-weight: var(--typography-input-value-default-font-weight);
  letter-spacing: var(--typography-input-value-default-letter-spacing);
}

/* ==== menu/dropdown-card.css ==== */
/* Dropdown card shared by the Menu's add / user variants (fast-add-menu,
   user-dropdown-panel) and the bowling alley's Help overlay (help-dropdown-container). */
.ats-dropdown-card {
  display: flex; flex-direction: column; gap: var(--menu-spacing-fastadd-gap); box-sizing: border-box;
  min-width: var(--menu-spacing-fastadd-min-width);
  padding: var(--menu-spacing-fastadd-padding-vertical) var(--menu-spacing-fastadd-padding-horizontal);
  background: var(--dropdown-color-background-default);
  /* Figma binds button/color/border/default (#f0f5f9), not in the code tokens: dropdown border used */
  border: var(--dropdown-border-width) solid var(--dropdown-color-border-default); border-radius: var(--dropdown-border-radius);
  /* general/level 4 */
  box-shadow: var(--elevation-4); backdrop-filter: blur(var(--elevation-4-blur));
  overflow: hidden;
  font-family: var(--typography-button-lg-font-family), 'Inter', sans-serif;
}

/* ==== menu/menu-option.css ==== */
/* MenuOption (Figma "menu-option" 157:2911). Unencapsulated, namespaced .ats-menu-option. */
.ats-menu-option {
  display: flex; align-items: center; gap: var(--spacing-gap-sm); box-sizing: border-box; width: 100%; margin: 0;
  padding: var(--button-spacing-default-gap) var(--button-spacing-default-padding-horizontal);
  border: 0; background: transparent; cursor: pointer; text-align: left;
  color: var(--color-text-body);
  font-family: var(--typography-button-lg-font-family), 'Inter', sans-serif;
}
.ats-menu-option:hover, .ats-menu-option.is-hover { background: var(--bowling-alley-color-tab-items-background-hover); }
/* Figma has no focus variant: the system focus ring (color/border/focus), inset */
.ats-menu-option:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
.ats-menu-option > .ats-icon, .ats-menu-option > .ats-icon-container { flex: 0 0 auto; }
/* text style button/lg; the entity type ellipsizes */
.ats-menu-option__label {
  white-space: nowrap;
  font-size: var(--typography-button-lg-font-size); line-height: var(--typography-button-lg-line-height);
  font-weight: var(--typography-button-lg-font-weight); letter-spacing: var(--typography-button-lg-letter-spacing);
}
.ats-menu-option[data-type="entity"] .ats-menu-option__label { flex: 1 0 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* active (Figma State=active): the current page, e.g. in the Amplify menu */
.ats-menu-option.is-active { background: var(--bowling-alley-color-tab-items-background-active); }

/* ==== bowling-alley/bowling-alley-shell.css ==== */
/* BowlingAlleyShell — stage / main / canvas layout, scrim and overlay layers.
   Every var used in a transition here is always defined on the shell. */
.ats-bowling-alley-shell {
  --ats-bowling-alley-w: 64px;        /* no token: collapsed width (Figma State=Collapsed) */
  --ats-bowling-alley-panel-w: 258px; /* no token: expanded width (Figma State=Open / Hover 2) */
  --ats-bowling-alley-find-w: 556px;  /* no token: Fast Find width (Figma 1323:67019) */
  display: flex; flex-direction: column; position: relative;
  /* The app frame is the browser window, as in the ATS: the page content scrolls inside the canvas,
     the bowling alley is never cut off and a pinned chat input stays at the bottom of the screen.
     Inside a sized container (docs frames) set `height: 100%` on the shell. */
  height: 100vh; height: 100dvh; min-height: 0; overflow: hidden;
  background: var(--color-background-subtle);
  font-family: var(--typography-font-family-base), 'Inter', -apple-system, sans-serif;
  color: var(--color-text-body);
}
.ats-bowling-alley-shell__stage { position: relative; flex: 1; min-height: 0; }

.ats-bowling-alley-shell__main {
  position: absolute; top: 0; bottom: 0; right: 0; left: var(--ats-bowling-alley-w);
  display: flex; flex-direction: column; min-width: 0;
  transition: left .18s ease;
}
.ats-bowling-alley-shell[data-nav="open"] .ats-bowling-alley-shell__main { left: var(--ats-bowling-alley-panel-w); }
.ats-bowling-alley-shell__canvas { flex: 1 0 0; min-width: 0; min-height: 0; overflow: auto; background: var(--color-background-default); }

/* scrim: color/background/overlay, under the bowling alley (z 30) */
.ats-bowling-alley-shell__scrim {
  position: absolute; inset: 0; z-index: 25; pointer-events: none;
  background: var(--color-background-overlay); opacity: 0; transition: opacity .15s ease;
}
.ats-bowling-alley-shell__scrim.is-on { opacity: 1; pointer-events: auto; }

.ats-bowling-alley-shell__overlays { position: absolute; inset: 0; z-index: 70; pointer-events: none; }
.ats-bowling-alley-shell__overlay { position: absolute; pointer-events: auto; }
.ats-bowling-alley-shell__results { display: flex; flex-direction: column; }
.ats-bowling-alley-shell__results .ats-fast-find-results { min-height: 0; }
.ats-bowling-alley-shell__tooltip { position: absolute; z-index: 90; }

/* ==== bowling-alley/bowling-alley.css ==== */
/* BowlingAlley (Figma "Bowling Alley" 157:2575) + main-tabs / record-tabs-divider /
   entity-tabs / footer. States key off the shell's data-nav (collapsed | hover | open)
   and data-find (open). Widths transition from always-defined vars only (CLAUDE.md). */

.ats-bowling-alley {
  position: absolute; top: 0; left: 0; bottom: 0; box-sizing: border-box; z-index: 30;
  width: var(--ats-bowling-alley-w);
  display: flex; padding: 0;
  transition: width .18s ease;
  font-family: var(--typography-bowling-alley-main-nav-font-family), 'Inter', sans-serif;
}
/* the card (Figma: the "Menu" layer) */
.ats-bowling-alley__card {
  flex: 1 0 0; min-width: 0; box-sizing: border-box;
  display: flex; flex-direction: column; gap: var(--bowling-alley-spacing-gap);
  padding: 12px 14px; /* no token: Figma 12 / 14px card padding (literal in the frame) */
  background: var(--bowling-alley-color-background-default);
  border-right: var(--bowling-alley-border-width-default) solid var(--bowling-alley-color-border-default);
  border-radius: var(--bowling-alley-border-radius-default);
  box-shadow: var(--elevation-3);
  overflow: hidden;
}
.ats-bowling-alley-shell[data-nav="open"] .ats-bowling-alley { width: var(--ats-bowling-alley-panel-w); }

/* hover ("State=Hover 2") and Fast Find: a floating card, 4px inset, level-4 shadow, over the page */
.ats-bowling-alley-shell[data-nav="hover"] .ats-bowling-alley { width: var(--ats-bowling-alley-panel-w); }
.ats-bowling-alley-shell[data-find="open"] .ats-bowling-alley { width: var(--ats-bowling-alley-find-w); z-index: 60; }
.ats-bowling-alley-shell[data-nav="hover"] .ats-bowling-alley,
.ats-bowling-alley-shell[data-find="open"] .ats-bowling-alley { padding: var(--spacing-4); }
.ats-bowling-alley-shell[data-nav="hover"] .ats-bowling-alley__card,
.ats-bowling-alley-shell[data-find="open"] .ats-bowling-alley__card {
  border: var(--bowling-alley-border-width-default) solid var(--bowling-alley-color-border-default);
  border-radius: var(--card-spacing-header-gap); /* Figma binds the radius to card/spacing/header/gap (8px) */
  box-shadow: var(--elevation-4); backdrop-filter: blur(var(--elevation-4-blur));
}

/* ---- bowling-alley-header: logo + collapse toggle ---- */
.ats-bowling-alley__head { display: flex; align-items: center; justify-content: space-between; min-height: 40px; flex: 0 0 auto; }
.ats-bowling-alley__logo { display: flex; align-items: center; gap: var(--spacing-8); height: 32px; overflow: hidden; }
.ats-bowling-alley__wordmark {
  display: none; white-space: nowrap; color: var(--bowling-alley-color-logo-text);
  font-family: var(--typography-title-default-font-family), 'Inter', sans-serif;
  font-weight: var(--typography-title-default-font-weight); font-size: var(--typography-title-default-font-size);
  line-height: var(--typography-title-default-line-height);
}
/* collapse-button: Icon button, 40px, radius button/border/radius/icon */
.ats-bowling-alley__toggle {
  display: none; align-items: center; justify-content: center; flex: 0 0 auto;
  min-width: 40px; min-height: 40px; border: 0; padding: 0; background: transparent; cursor: pointer;
  border-radius: var(--button-border-radius-icon);
}
.ats-bowling-alley__toggle:hover { background: var(--bowling-alley-color-tab-items-background-hover); }

/* ---- bowling-alley-tabs-section ---- */
.ats-bowling-alley__tabs { display: flex; flex-direction: column; gap: var(--bowling-alley-spacing-tabs-gap); min-height: 0; flex: 0 1 auto; }
.ats-bowling-alley__section { display: flex; flex-direction: column; gap: var(--spacing-8); }
.ats-bowling-alley__find { flex: 0 0 auto; }

/* ---- tabs (main-tabs / entity-tabs) ---- */
.ats-bowling-alley-tab, .ats-bowling-alley__parse {
  display: flex; align-items: center; gap: var(--bowling-alley-spacing-tabs-gap); box-sizing: border-box;
  width: 100%; min-width: 0; border: 0; margin: 0; background: transparent; cursor: pointer;
  padding: var(--bowling-alley-spacing-tabs-padding-vertical) var(--bowling-alley-spacing-tabs-padding-horizontal);
  border-radius: var(--bowling-alley-border-tabs-radius);
  color: var(--bowling-alley-color-content-text-default);
  text-align: left; position: relative; font-family: inherit; white-space: nowrap;
}
.ats-bowling-alley-tab:hover { background: var(--bowling-alley-color-tab-items-background-hover); color: var(--bowling-alley-color-content-text-hover); }
.ats-bowling-alley-tab.is-active { background: var(--bowling-alley-color-tab-items-background-active); color: var(--bowling-alley-color-content-text-hover); }
.ats-bowling-alley-tab:focus-visible, .ats-bowling-alley__parse:focus-visible, .ats-bowling-alley-foot-item:focus-visible,
.ats-bowling-alley__toggle:focus-visible, .ats-bowling-alley-tab__actions button:focus-visible, .ats-bowling-alley-divider__clear:focus-visible {
  outline: 2px solid var(--color-border-focus); outline-offset: -2px;
}
.ats-bowling-alley-tab__icon {
  flex: 0 0 auto; width: 24px; height: 24px; box-sizing: border-box; border-radius: var(--border-radius-xsm);
  display: flex; align-items: center; justify-content: center;
}
/* entity tabs: the icon is an <ats-icon-container size="sm"> (Figma icon-container instance), which paints its own fill */
.ats-bowling-alley-tab__label {
  display: none; flex: 1 0 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: var(--typography-bowling-alley-main-nav-font-size); line-height: var(--typography-bowling-alley-main-nav-line-height);
  font-weight: var(--typography-bowling-alley-main-nav-font-weight); letter-spacing: var(--typography-bowling-alley-main-nav-letter-spacing);
}
.ats-bowling-alley-tab--entity .ats-bowling-alley-tab__label {
  font-size: var(--typography-bowling-alley-entity-font-size); line-height: var(--typography-bowling-alley-entity-line-height);
  font-weight: var(--typography-bowling-alley-entity-font-weight);
}
.ats-bowling-alley-tab--entity.is-active .ats-bowling-alley-tab__label { font-weight: var(--typography-bowling-alley-entity-font-weight-active); }
/* pin / close actions (entity tabs) */
.ats-bowling-alley-tab__actions { margin-left: auto; display: none; align-items: center; gap: var(--spacing-gap-xsm); }
.ats-bowling-alley-tab__actions button {
  border: 0; background: transparent; cursor: pointer; padding: 0; border-radius: var(--border-radius-xsm);
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
}
.ats-bowling-alley-tab__actions button:hover { background: var(--bowling-alley-color-tab-items-background-hover); }
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley-tab--entity:hover .ats-bowling-alley-tab__actions,
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley-tab--entity:focus-within .ats-bowling-alley-tab__actions,
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley-tab--entity.is-pinned .ats-bowling-alley-tab__actions { display: flex; }
.ats-bowling-alley-tab--entity.is-pinned:not(:hover):not(:focus-within) .ats-bowling-alley-tab__close { display: none; }
.ats-bowling-alley-tab.is-dragging { opacity: .5; }
.ats-bowling-alley-drop-line {
  height: 2px; margin: -5px 0; border-radius: 1px; flex: 0 0 auto; pointer-events: none;
  background: var(--color-border-focus);
}

/* "next" chevron on openers */
.ats-bowling-alley-tab__next {
  margin-left: auto; display: none; flex: 0 0 auto;
  width: 24px; height: 24px; align-items: center; justify-content: center;
}
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley-tab--opener:hover .ats-bowling-alley-tab__next,
.ats-bowling-alley-tab--opener.is-active .ats-bowling-alley-tab__next { display: flex; }

/* Amplify brand glyph: the icon mask filled with the Amplify radial gradient
   (no token: gradient stops from the Figma asset amplify.svg) */
.ats-icon.ats-bowling-alley__amplify-glyph {
  background: radial-gradient(circle at 14% 12%, #37fc97 0%, #a5f7d0 0.01%, #23afdc 47%, #09a0de 56%, #009bdf 65%, #125783 97%);
}

/* ---- record-tabs-divider ---- */
.ats-bowling-alley-divider { display: flex; align-items: center; gap: var(--bowling-alley-spacing-tabs-gap); height: 32px; flex: 0 0 auto; }
.ats-bowling-alley-divider__line { flex: 1 0 0; min-width: 1px; height: 1px; background: var(--bowling-alley-color-border-default); }
/* Clear All: Dialogue small button */
.ats-bowling-alley-divider__clear {
  display: none; align-items: center; gap: var(--button-spacing-small-gap); margin: 0; min-height: 32px; box-sizing: border-box;
  background: var(--button-color-dialogue-background-hover); border: 0; cursor: pointer;
  padding: var(--button-spacing-small-padding-vertical) var(--button-spacing-small-padding-horizontal);
  border-radius: var(--button-border-radius-dialogue);
  font-family: inherit; font-size: var(--typography-button-sm-font-size); line-height: var(--typography-button-sm-line-height);
  font-weight: var(--typography-button-sm-font-weight); color: var(--button-color-dialogue-content-default); white-space: nowrap;
}
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley-divider:hover .ats-bowling-alley-divider__clear,
.ats-bowling-alley-divider.is-hovering .ats-bowling-alley-divider__clear { display: flex; }

/* ---- bowling-alley-footer: Parse Resume uploader + Help / Privacy / user ---- */
.ats-bowling-alley__foot {
  flex: 1 0 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  gap: var(--bowling-alley-spacing-gap);
}
.ats-bowling-alley__parse {
  justify-content: center; gap: 0; padding: var(--spacing-4);
  border: var(--border-width-border-default) dashed var(--bowling-alley-color-uploader-border-default);
}
.ats-bowling-alley__parse:hover { background: var(--bowling-alley-color-uploader-background-hover); border-color: var(--bowling-alley-color-uploader-border-hover); }
.ats-bowling-alley__parse .ats-bowling-alley-tab__label {
  flex: 0 0 auto; font-size: var(--typography-bowling-alley-entity-font-size); line-height: var(--typography-bowling-alley-entity-line-height);
}
.ats-bowling-alley__foot-actions { display: flex; gap: var(--spacing-padding-sm); align-items: stretch; width: 100%; }
.ats-bowling-alley-foot-item {
  flex: 1 0 0; min-width: 48px; height: 72px; box-sizing: border-box; margin: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: var(--bowling-alley-spacing-tabs-gap);
  border: 0; background: transparent; cursor: pointer; font-family: inherit;
  padding: var(--bowling-alley-spacing-tabs-padding-vertical) var(--bowling-alley-spacing-tabs-padding-horizontal);
  border-radius: var(--bowling-alley-border-tabs-radius); color: var(--bowling-alley-color-content-text-default);
}
.ats-bowling-alley-foot-item:hover { background: var(--bowling-alley-color-tab-items-background-hover); }
.ats-bowling-alley-foot-item.is-active { background: var(--bowling-alley-color-tab-items-background-active); }
.ats-bowling-alley-foot-item .ats-bowling-alley-tab__label {
  flex: 0 0 auto; width: 100%; text-align: center; white-space: normal; overflow-wrap: anywhere;
  font-size: var(--typography-bowling-alley-entity-font-size); line-height: var(--typography-bowling-alley-entity-line-height);
}
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley-foot-item .ats-bowling-alley-tab__label {
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ats-bowling-alley__avatar {
  width: var(--avatar-spacing-width); height: var(--avatar-spacing-height); border-radius: var(--avatar-border-radius-round);
  background: var(--avatar-color-background-default); color: var(--avatar-color-content-default);
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  font-size: 12px; line-height: 16px; font-weight: var(--typography-bowling-alley-main-nav-font-weight-active); /* no token: avatar initials 12/16 */
}

/* ---- expanded (hover / open / Fast Find) vs collapsed ---- */
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley__wordmark,
.ats-bowling-alley-shell[data-find="open"] .ats-bowling-alley__wordmark,
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley-tab__label,
.ats-bowling-alley-shell[data-find="open"] .ats-bowling-alley-tab__label { display: block; }
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley__toggle,
.ats-bowling-alley-shell[data-find="open"] .ats-bowling-alley__toggle { display: flex; }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley__card { padding-inline: var(--bowling-alley-spacing-collapsed-padding-left); }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley__head { justify-content: center; }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley-tab { justify-content: center; }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley-tab__actions { display: none !important; }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley__parse { display: none; }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley__foot-actions { flex-direction: column; align-items: center; }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley-foot-item { flex: 0 0 auto; height: auto; }
.ats-bowling-alley-shell[data-nav="collapsed"]:not([data-find="open"]) .ats-bowling-alley[data-collapsed-foot="user"] .ats-bowling-alley-foot-item--utility { display: none; }

/* ---- Amplify tab + Amplify menu chevron (Figma main-tabs "show button"; amplify-nav-dropdown 6815:49406) ---- */
.ats-bowling-alley__amplify { position: relative; display: flex; }
.ats-bowling-alley__amplify > .ats-bowling-alley-tab { flex: 1 1 auto; }
.ats-bowling-alley__amplify-menu {
  position: absolute; top: 50%; right: var(--spacing-4); transform: translateY(-50%); display: none;
}
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley__amplify:hover .ats-bowling-alley__amplify-menu,
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley__amplify:focus-within .ats-bowling-alley__amplify-menu,
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley__amplify.is-menu-open .ats-bowling-alley__amplify-menu { display: inline-flex; }
/* keep the label clear of the chevron */
.ats-bowling-alley-shell:not([data-nav="collapsed"]) .ats-bowling-alley__amplify > .ats-bowling-alley-tab { padding-right: calc(var(--spacing-24) + var(--spacing-8)); }

/* ==== bowling-alley/tooltip.css ==== */
/* tooltip (Figma "tooltip", Small / bottom-right). Figma Overlays section (491:38820). */
.ats-tooltip {
  display: inline-flex; flex-direction: column; align-items: flex-start; pointer-events: none;
  /* no token: the tooltip's two-layer drop-shadow (filter, so it wraps the arrow) */
  filter: drop-shadow(0 2px 4px rgba(40,40,40,.08)) drop-shadow(4px 6px 8px rgba(40,40,40,.08));
  font-family: var(--typography-font-family-base), 'Inter', sans-serif;
}
.ats-tooltip__arrow {
  width: 0; height: 0; margin-left: 6px;
  border-left: 9px solid transparent; border-right: 9px solid transparent;
  border-bottom: 4px solid var(--color-text-body);
}
.ats-tooltip__box {
  background: var(--color-text-body); color: var(--color-background-default);
  border-radius: 3px; /* no token: 3px radius (between xxsm 2px and xsm 4px) */
  padding: var(--spacing-padding-sm);
  font-size: 14px; line-height: 20px; white-space: nowrap;
}

/* ==== amplify-chat/docked/conversation.css ==== */
/* AmplifyChatConversation (Figma "conversation" frame in docked-chat 6327:204603).
   Unencapsulated, namespaced .ats-amplify-chat-conversation. */
.ats-amplify-chat-conversation {
  display: flex; flex-direction: column; box-sizing: border-box;
  width: 100%; height: 100%; min-height: 0; min-width: 0;
}

/* The scroller holds both the turns and the (sticky) input, so replies scroll behind the
   input and the last turn always clears it. */
.ats-amplify-chat-conversation__scroll {
  display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  position: relative; /* contains absolutely positioned bits in replies (e.g. visually hidden live
     regions), so they scroll and clip with the turns instead of stretching the page */
  gap: var(--amplify-chat-docked-chat-spacing-conversation-gap);
}

/* chat column: turns spacing/gap/xlg (32) apart; grows so the input sits at the bottom */
.ats-amplify-chat-conversation__column {
  display: flex; flex-direction: column; flex: 1 0 auto; box-sizing: border-box; min-width: 0;
  gap: var(--amplify-chat-docked-chat-spacing-chat-column-gap);
}

/* input area: general/level 2 - scroll (color/background/scroll + background blur) */
.ats-amplify-chat-conversation__input {
  position: sticky; bottom: 0; z-index: 1;
  display: flex; flex-direction: column; box-sizing: border-box; min-width: 0;
  background: var(--color-background-scroll);
  backdrop-filter: blur(var(--elevation-4-blur)); /* no token for the level-2-scroll blur: reuses the elevation blur (4) */
}
.ats-amplify-chat-conversation__input:empty { display: none; }

/* ---- full page: one 800px column (turns and input share its edges), centered ---- */
.ats-amplify-chat-conversation[data-size="full page"] .ats-amplify-chat-conversation__scroll {
  /* Figma full page: chat column 24 below the header; narrow windows: spacing/margin (24) per side */
  padding: var(--spacing-margin) var(--spacing-margin) 0;
}
.ats-amplify-chat-conversation[data-size="full page"] .ats-amplify-chat-conversation__column,
.ats-amplify-chat-conversation[data-size="full page"] .ats-amplify-chat-conversation__input {
  width: 100%; max-width: 800px; /* no token: chat column 800 max (patterns doc) */
  margin-inline: auto;
}
.ats-amplify-chat-conversation[data-size="full page"] .ats-amplify-chat-conversation__input {
  padding-bottom: var(--spacing-margin); /* Figma full page: input 24 above the page bottom */
}

/* ---- docked: fills the panel; turns inset padding/sm, user turns a further padding/lg ---- */
/* the docked-chat main padding (16 top, 8 sides, 8 bottom) sits inside the scroller, so
   scrolled content isn't clipped short of the header and panel edges */
.ats-amplify-chat-conversation[data-size="docked"] .ats-amplify-chat-conversation__scroll {
  padding:
    var(--amplify-chat-docked-chat-spacing-main-padding-top-default)
    var(--amplify-chat-docked-chat-spacing-main-padding-right)
    0
    var(--amplify-chat-docked-chat-spacing-main-padding-left);
}
.ats-amplify-chat-conversation[data-size="docked"] .ats-amplify-chat-conversation__input {
  padding-bottom: var(--amplify-chat-docked-chat-spacing-main-padding-bottom);
}
.ats-amplify-chat-conversation[data-size="docked"] .ats-amplify-chat-conversation__column {
  padding-inline: var(--amplify-chat-docked-chat-spacing-chat-column-padding-horizontal);
}
.ats-amplify-chat-conversation[data-size="docked"] .ats-amplify-chat-conversation__column > .ats-amplify-chat-user-turn {
  padding-left: var(--amplify-chat-docked-chat-spacing-user-turn-padding-left);
}

/* ==== amplify-chat/reply/chat-block.css ==== */
/* AmplifyChatChatBlock (Figma "amplify-chat/chat-block" 6150:20828).
   Unencapsulated, namespaced .ats-amplify-chat-chat-block. */
.ats-amplify-chat-chat-block {
  display: flex; flex-direction: column; align-items: stretch;
  gap: var(--amplify-chat-chat-block-spacing-gap);
  box-sizing: border-box; width: 100%; min-width: 0;
  position: relative; /* positioning context for the visually hidden live region */
}

/* identity: Icon/Amplify Radial 16 + "Amplify" body/sm-medium color/text/secondary */
.ats-amplify-chat-chat-block__identity {
  display: flex; align-items: center;
  gap: var(--amplify-chat-chat-block-spacing-identity-gap);
  color: var(--amplify-chat-chat-block-color-content-identity);
  font-family: var(--typography-body-sm-font-family), 'Inter', sans-serif;
  font-size: var(--typography-body-sm-font-size);
  font-weight: var(--typography-body-sm-font-weight-medium);
  line-height: var(--typography-body-sm-line-height);
  letter-spacing: var(--typography-body-sm-letter-spacing);
}
/* Icon/Amplify Radial: the glyph mask filled with the Amplify radial gradient
   (no token: gradient stops from the Figma asset amplify.svg, as in amplify-chat/text) */
.ats-icon.ats-amplify-chat-chat-block__identity-icon {
  background: radial-gradient(circle at 14% 12%, #37fc97 0%, #a5f7d0 0.01%, #23afdc 47%, #09a0de 56%, #009bdf 65%, #125783 97%);
}

/* body: the projected reply, in order. Paragraph to block = gap/md (16). */
.ats-amplify-chat-chat-block__body {
  display: flex; flex-direction: column; align-items: stretch;
  gap: var(--amplify-chat-chat-block-spacing-gap);
  min-width: 0;
}
.ats-amplify-chat-chat-block__body[hidden] { display: none; }
.ats-amplify-chat-chat-block__body:empty { display: none; }
/* paragraph to paragraph: gap/sm (8) — Figma answer frame gap */
.ats-amplify-chat-chat-block__body > .ats-amplify-chat-text + .ats-amplify-chat-text {
  margin-top: calc(var(--amplify-chat-chat-block-spacing-answer-gap) - var(--amplify-chat-chat-block-spacing-gap));
}
/* section: 24 above a heading (gap/md + section padding-top 8), heading to its content gap/sm (8) */
.ats-amplify-chat-chat-block__body > .ats-amplify-chat-header {
  margin-top: var(--amplify-chat-chat-block-spacing-section-padding-top);
}
.ats-amplify-chat-chat-block__body > .ats-amplify-chat-header:first-child { margin-top: 0; }
.ats-amplify-chat-chat-block__body > .ats-amplify-chat-header + * {
  margin-top: calc(var(--amplify-chat-chat-block-spacing-section-gap) - var(--amplify-chat-chat-block-spacing-gap));
}

/* footer: sources row, then follow-up chips gap/sm (8) below it */
.ats-amplify-chat-chat-block__footer {
  display: flex; flex-direction: column; align-items: stretch;
  gap: var(--amplify-chat-chat-block-spacing-footer-gap);
}
.ats-amplify-chat-chat-block__follow-ups {
  display: flex; flex-wrap: wrap; align-items: flex-start;
  gap: var(--amplify-chat-chat-block-spacing-follow-ups-gap);
}

/* controls: chat actions (left) + optional primary action (right) */
.ats-amplify-chat-chat-block__controls {
  display: flex; align-items: center;
  gap: var(--amplify-chat-chat-block-spacing-controls-gap);
}
.ats-amplify-chat-chat-block__actions {
  display: flex; align-items: center; flex: 1 0 0; min-width: 1px;
  gap: var(--amplify-chat-chat-block-spacing-actions-gap);
}
.ats-amplify-chat-chat-block__actions > .ats-icon-button-no-container:not(:hover):not(:active):not(.is-active):not(:focus-visible) {
  color: var(--button-color-icon-content-default);
}

/* visually hidden live region ("Copied") */
.ats-amplify-chat-chat-block__sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

/* ==== amplify-chat/reply/user-turn.css ==== */
/* AmplifyChatUserTurn (Figma "user-turn" 6237:176861): right-aligns the user bubble in the chat column. */
.ats-amplify-chat-user-turn { display: flex; justify-content: flex-end; box-sizing: border-box; width: 100%; min-width: 0; }

/* ==== amplify-chat/user-messages/user-bubble.css ==== */
/* AmplifyChatUserBubble (Figma "amplify-chat/user-bubble" 6213:168866).
   Unencapsulated, namespaced .ats-amplify-chat-user-bubble. */
.ats-amplify-chat-user-bubble {
  display: flex; flex-direction: column; align-items: flex-start;
  gap: var(--amplify-chat-user-bubble-spacing-content-gap);
  box-sizing: border-box; width: fit-content;
  max-width: min(440px, 100%); /* no token: Figma max width 440 */
  padding: var(--amplify-chat-user-bubble-spacing-padding-vertical) var(--amplify-chat-user-bubble-spacing-padding-horizontal);
  border-radius: var(--amplify-chat-user-bubble-border-radius);
  background: var(--amplify-chat-user-bubble-color-background);
}
/* long text (either state) fills the 440 max, as in Figma */
.ats-amplify-chat-user-bubble.is-long { width: min(440px, 100%); }

/* message viewport: capped at 8 lines (the cap follows the type scale, not pixels) */
.ats-amplify-chat-user-bubble__viewport {
  --_line: var(--typography-body-default-line-height);
  --_cap: calc(var(--_line) * 8);
  align-self: stretch; min-width: 0;
  max-height: var(--_cap); overflow: hidden;
}
/* collapsed: the last 2 lines fade out through an alpha mask, so the text keeps its token color */
.ats-amplify-chat-user-bubble.is-long:not(.is-expanded) .ats-amplify-chat-user-bubble__viewport {
  height: var(--_cap);
  -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 2 * var(--_line)), transparent);
  mask-image: linear-gradient(to bottom, black calc(100% - 2 * var(--_line)), transparent);
}
.ats-amplify-chat-user-bubble.is-expanded .ats-amplify-chat-user-bubble__viewport { max-height: none; }

.ats-amplify-chat-user-bubble__message {
  overflow-wrap: break-word; word-break: break-word; white-space: pre-line;
  color: var(--amplify-chat-user-bubble-color-content-message);
  font-family: var(--typography-body-default-font-family), 'Inter', sans-serif;
  font-size: var(--typography-body-default-font-size);
  font-weight: var(--typography-body-default-font-weight-default);
  line-height: var(--typography-body-default-line-height);
  letter-spacing: var(--typography-body-default-letter-spacing);
}
.ats-amplify-chat-user-bubble__message > p { margin: 0 0 var(--amplify-chat-user-bubble-spacing-padding-vertical); }
.ats-amplify-chat-user-bubble__message > p:last-child { margin-bottom: 0; }

/* Show More / Show Less: Button Dialogue Small; its label lines up with the text */
.ats-amplify-chat-user-bubble__toggle { flex: 0 0 auto; }

/* state=clarify answers: one row per question. Rows spacing/4 apart (the bubble gap); a question
   label column (80, input/label/field-label, color/text/subtle), spacing/16, then the answer in the
   message style, or the inline entity link when the answer is a record. */
.ats-amplify-chat-user-bubble__viewport[hidden] { display: none; }
.ats-amplify-chat-user-bubble__answers {
  display: flex; flex-direction: column; margin: 0;
  gap: var(--amplify-chat-user-bubble-spacing-content-gap);
  min-width: 0;
}
.ats-amplify-chat-user-bubble__answer {
  display: flex; align-items: center; min-width: 0;
  gap: var(--spacing-16); /* Figma binds context-container/spacing/padding-horizontal (spacing/16) */
}
.ats-amplify-chat-user-bubble__question {
  flex: 0 0 80px; /* no token: Figma 80px question column */
  margin: 0; overflow-wrap: break-word;
  color: var(--color-text-subtle);
  font-family: var(--typography-input-label-field-label-font-family), 'Inter', sans-serif;
  font-size: var(--typography-input-label-field-label-font-size);
  font-weight: var(--typography-input-label-field-label-font-weight);
  line-height: var(--typography-input-label-field-label-line-height);
  letter-spacing: var(--typography-input-label-field-label-letter-spacing);
}
.ats-amplify-chat-user-bubble__value {
  flex: 1 1 auto; min-width: 0; margin: 0; overflow-wrap: break-word;
  color: var(--amplify-chat-user-bubble-color-content-message);
  font-family: var(--typography-body-default-font-family), 'Inter', sans-serif;
  font-size: var(--typography-body-default-font-size);
  font-weight: var(--typography-body-default-font-weight-default);
  line-height: var(--typography-body-default-line-height);
  letter-spacing: var(--typography-body-default-letter-spacing);
}

/* ==== amplify-chat/text/text.css ==== */
/* AmplifyChatText (Figma "amplify-chat/text" 6148:20800). Unencapsulated, namespaced .ats-amplify-chat-text. */
.ats-amplify-chat-text { display: block; box-sizing: border-box; margin: 0; min-width: 0; overflow-wrap: break-word; }

/* type=paragraph / paragraph-with-links: body/default in color/text/body */
.ats-amplify-chat-text--paragraph {
  color: var(--amplify-chat-text-color-content-paragraph);
  font-family: var(--typography-body-default-font-family), 'Inter', sans-serif;
  font-size: var(--typography-body-default-font-size);
  font-weight: var(--typography-body-default-font-weight-default);
  line-height: var(--typography-body-default-line-height);
  letter-spacing: var(--typography-body-default-letter-spacing);
}
/* Bold (**) = body/default-medium, same color */
.ats-amplify-chat-text--paragraph :is(strong, b) {
  font-weight: var(--typography-body-default-font-weight-medium);
}
/* Several projected <p>: Figma paragraph spacing between them */
.ats-amplify-chat-text--paragraph .ats-amplify-chat-text__content > p { margin: 0; }
.ats-amplify-chat-text--paragraph .ats-amplify-chat-text__content > p + p { margin-top: var(--spacing-padding-sm); }

/* type=status: Amplify icon + body/sm in color/text/secondary */
.ats-amplify-chat-text--status {
  display: flex; align-items: center; gap: var(--amplify-chat-text-spacing-status-gap);
  color: var(--amplify-chat-text-color-content-status);
  font-family: var(--typography-body-sm-font-family), 'Inter', sans-serif;
  font-size: var(--typography-body-sm-font-size);
  font-weight: var(--typography-body-sm-font-weight-default);
  line-height: var(--typography-body-sm-line-height);
  letter-spacing: var(--typography-body-sm-letter-spacing);
}
.ats-amplify-chat-text__content { display: contents; }
.ats-amplify-chat-text--status .ats-amplify-chat-text__content { display: block; flex: 1 0 0; min-width: 1px; }
/* Icon/Amplify Radial: the glyph mask filled with the Amplify radial gradient
   (no token: gradient stops from the Figma asset amplify.svg, as in bowling-alley.css) */
.ats-icon.ats-amplify-chat-text__icon {
  background: radial-gradient(circle at 14% 12%, #37fc97 0%, #a5f7d0 0.01%, #23afdc 47%, #09a0de 56%, #009bdf 65%, #125783 97%);
}

/* ==== amplify-chat/text/link.css ==== */
/* AmplifyChatLink (inline entity link, Figma amplify-chat/text type=paragraph-with-links 6154:20875).
   Unencapsulated, namespaced .ats-amplify-chat-link. Inherits font family / size / line height
   from the surrounding paragraph; sets the medium weight and link color. */
.ats-amplify-chat-link {
  color: var(--link-text-color-default);
  font-weight: var(--typography-body-default-font-weight-medium);
  text-decoration: none; cursor: pointer; border-radius: var(--border-radius-xsm);
}
.ats-amplify-chat-link:hover, .ats-amplify-chat-link.is-hover { color: var(--link-text-color-hover); }
.ats-amplify-chat-link:focus-visible, .ats-amplify-chat-link.is-focus {
  outline: var(--button-border-width-focus) solid var(--color-border-focus); outline-offset: 1px;
}

/* The circle stays the entity color in every state. Figma's "●" renders ~10px; Inter's is
   ~0.43em, so the glyph is scaled up (line-height 0 keeps the line box unchanged). It stays a
   text glyph so the no-break space really keeps it on the same line as the name. */
.ats-amplify-chat-link__circle {
  font-weight: var(--typography-body-default-font-weight-default);
  font-size: 1.65em; line-height: 0; vertical-align: -0.12em; /* no token: matches Figma's 10px circle */
}
.ats-amplify-chat-link[data-entity="job"] .ats-amplify-chat-link__circle { color: var(--color-entity-job); }
.ats-amplify-chat-link[data-entity="company"] .ats-amplify-chat-link__circle { color: var(--color-entity-company); }
.ats-amplify-chat-link[data-entity="candidate"] .ats-amplify-chat-link__circle { color: var(--color-entity-candidate); }
.ats-amplify-chat-link[data-entity="contact"] .ats-amplify-chat-link__circle { color: var(--color-entity-contact); }
.ats-amplify-chat-link[data-entity="lead"] .ats-amplify-chat-link__circle { color: var(--color-entity-lead); }
.ats-amplify-chat-link[data-entity="opportunity"] .ats-amplify-chat-link__circle { color: var(--color-entity-opportunity); }
.ats-amplify-chat-link[data-entity="placement"] .ats-amplify-chat-link__circle { color: var(--color-entity-placement); }
.ats-amplify-chat-link[data-entity="submission"] .ats-amplify-chat-link__circle { color: var(--color-entity-submission); }

/* ==== amplify-chat/text/header.css ==== */
/* AmplifyChatHeader (Figma "amplify-chat/header" 6147:20798). Unencapsulated, namespaced .ats-amplify-chat-header. */
.ats-amplify-chat-header {
  display: block; box-sizing: border-box; margin: 0; min-width: 0;
  overflow-wrap: break-word; color: var(--amplify-chat-header-color-content-section);
}

/* level=section: title/sm */
.ats-amplify-chat-header--section {
  font-family: var(--typography-title-small-font-family), 'Inter', sans-serif;
  font-size: var(--typography-title-small-font-size);
  font-weight: var(--typography-title-small-font-weight);
  line-height: var(--typography-title-small-line-height);
  letter-spacing: var(--typography-title-small-letter-spacing);
}

/* level=label: body/default-medium */
.ats-amplify-chat-header--label {
  color: var(--amplify-chat-header-color-content-label);
  font-family: var(--typography-body-default-font-family), 'Inter', sans-serif;
  font-size: var(--typography-body-default-font-size);
  font-weight: var(--typography-body-default-font-weight-medium);
  line-height: var(--typography-body-default-line-height);
  letter-spacing: var(--typography-body-default-letter-spacing);
}

/* ==== novo-data-table/novo-data-table.css ==== */
/* NovoDataTable — Figma "novo-data-table" (Component Migration 46:1541 / 254:6720),
   ported from the prototype repo's data-table.css. Authored against the Tier-3
   data-table/* + checkbox/* tokens, so it re-themes and follows the grayscale mode.

   Structure: host (scroller) > native <table> > thead (sticky header row) + tbody
   rows; each row = checkbox cell + preview-icon cell + data cells.
   Table cells carry no padding; the flex box inside each (.ats-ndt-cell) holds the
   source's min-height / min-width / padding / gap so sizes match 1:1.
   Unencapsulated so the three components share it; namespaced .ats-ndt*. */

.ats-ndt { display: block; overflow: auto; }   /* horizontal + vertical scroller */

.ats-ndt__table {
  border-collapse: separate; border-spacing: 0;
  width: max-content; min-width: 100%; isolation: isolate;
}

.ats-ndt-th, .ats-ndt-td {
  padding: 0; text-align: left; vertical-align: middle; font: inherit;
  border-bottom: var(--data-table-border-width-default, 1px) solid var(--data-table-color-border-default);
}

/* sticky header row (sticky on the cells: works across engines) */
.ats-ndt-th {
  background: var(--data-table-color-background-default);
  position: sticky; top: 0; z-index: 2;
}
.ats-ndt-row--banded > .ats-ndt-td { background: var(--data-table-color-background-muted); }
/* row hover (Figma novo-data-table-row hover 254:593): background only; border and
   text stay default. Real :hover + forced via NovoDataTable `hoverRow`. No focus state. */
.ats-ndt-row:hover > .ats-ndt-td,
.ats-ndt-row.is-hover > .ats-ndt-td { background: var(--data-table-color-background-hover); }

.ats-ndt-cell {
  display: flex; align-items: center; gap: var(--data-table-spacing-gap-cell);
  min-height: var(--data-table-spacing-min-height); min-width: var(--data-table-spacing-min-width);
  padding: var(--data-table-spacing-padding-vertical) var(--data-table-spacing-padding-horizontal);
  box-sizing: border-box;
}
.ats-ndt-cell--check { min-width: 0; }
.ats-ndt-cell--icon  { min-width: 0; gap: 0; }   /* 16 + 16px icon + 16 = 48px, as in Figma 254:537 */
.ats-ndt-th--check, .ats-ndt-td--check, .ats-ndt-th--icon, .ats-ndt-td--icon { width: 1px; } /* shrink to content */

/* header cell — text style input/label/md, colour data-table/color/content/header.
   Figma 254:495 sets the text case to uppercase on the layer (the input/label/md
   text-transform token says capitalize), so uppercase is applied here. */
.ats-ndt-hcell__label {
  font-family: var(--typography-input-label-md-font-family), 'Inter', sans-serif;
  font-weight: var(--typography-input-label-md-font-weight); font-size: var(--typography-input-label-md-font-size);
  line-height: var(--typography-input-label-md-line-height); letter-spacing: var(--typography-input-label-md-letter-spacing);
  text-transform: var(--typography-text-transform-uppercase);
  color: var(--data-table-color-content-header); white-space: nowrap;
}
/* header sort / filter icons and the row preview icon: data-table/color/icon/default */
.ats-ndt .ats-icon.ats-ndt-ic,
.ats-ndt-hcell .ats-icon.ats-ndt-ic { display: block; background-color: var(--data-table-color-icon-default); }
.ats-ndt .ats-icon.ats-ndt-preview { display: block; background-color: var(--data-table-color-icon-default); }

/* body cell text — text style input/value/default; hyperlink = input/value/hyperlinks */
.ats-ndt-cell__text {
  font-family: var(--typography-input-value-default-font-family), 'Inter', sans-serif;
  font-weight: var(--typography-input-value-default-font-weight); font-size: var(--typography-input-value-default-font-size);
  line-height: var(--typography-input-value-default-line-height); letter-spacing: var(--typography-input-value-default-letter-spacing);
  color: var(--data-table-color-content-default);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.ats-ndt-cell__text--link {
  font-family: var(--typography-input-value-hyperlinks-font-family), 'Inter', sans-serif;
  font-weight: var(--typography-input-value-hyperlinks-font-weight);
  color: var(--data-table-color-content-hyperlink);
  cursor: pointer;   /* not wired to a destination yet, but reads as a link */
}
.ats-ndt-cell__text--link:hover,
.ats-ndt-cell__text--link.is-hover { color: var(--data-table-color-content-hyperlink-hover); }

/* visually hidden label (empty preview header) */
.ats-ndt-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==== amplify-chat/data-table/data-table.css ==== */
/* Amplify chat data-table rows — Figma novo-data-table-header-row-chat (6171:165361) and
   novo-data-table-row-chat (6174:165788). Built on the novo-data-table cells, so the base
   cell layout (.ats-ndt-*) comes from novo-data-table.css; this file adds the chat tokens
   and the chat-only cell content. Unencapsulated, namespaced .ats-amplify-chat-data-table-*. */

/* row background + divider: the amplify-chat row / header-row tokens */
.ats-amplify-chat-data-table-header-row > .ats-ndt-th {
  background: var(--data-table-color-background-default);
  border-bottom-color: var(--data-table-color-border-default);
}
.ats-amplify-chat-data-table-row > .ats-ndt-td {
  background: var(--data-table-color-background-default);
  border-bottom-color: var(--data-table-color-border-default);
}
.ats-amplify-chat-data-table-row:hover > .ats-ndt-td,
.ats-amplify-chat-data-table-row.is-hover > .ats-ndt-td { background: var(--data-table-color-background-hover); }

/* Chat columns have no minimum width (the 128 in Figma is a Figma error, per the patterns doc). */
.ats-amplify-chat-data-table-header-row .ats-ndt-cell,
.ats-amplify-chat-data-table-row .ats-ndt-cell { min-width: 0; }

/* preview: the binoculars as a button (opens the slideout) */
.ats-amplify-chat-data-table-row__preview {
  display: flex; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
  border-radius: var(--border-radius-xsm);
}
.ats-amplify-chat-data-table-row__preview:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

/* name cell: avatar + link, gap link-text/spacing/gap/default (4) */
.ats-amplify-chat-data-table-row__name > .ats-ndt-cell {
  gap: var(--link-text-spacing-gap-default);

/* ==== amplify-chat/clarifying-questions/clarify-key.css ==== */
/* AmplifyChatClarifyKey (Figma "clarify-key" 6334:28241). Values are the
   --amplify-chat-clarify-key-* tokens Figma binds. The look is driven by private
   vars so a parent row (clarify-option / clarify-something-else) can switch it.
   The 1px stroke is an inset shadow, so the key stays 24×24 in every state. */
.ats-amplify-chat-clarify-key {
  --_key-bg: var(--amplify-chat-clarify-key-color-background-default);
  --_key-border: transparent;
  --_key-fg: var(--amplify-chat-clarify-key-color-content-number-default);
  --_key-icon: var(--amplify-chat-clarify-key-color-content-icon);
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; box-sizing: border-box;
  width: 24px; height: 24px; /* no token: Figma 24×24 */
  border-radius: var(--amplify-chat-clarify-key-border-radius);
  background: var(--_key-bg);
  box-shadow: inset 0 0 0 1px var(--_key-border); /* no token: Figma 1px stroke */
  color: var(--_key-fg);
  font-family: var(--typography-input-label-field-label-font-family), 'Inter', sans-serif;
  font-size: var(--typography-input-label-field-label-font-size);
  font-weight: var(--typography-input-label-field-label-font-weight);
  line-height: var(--typography-input-label-field-label-line-height);
  letter-spacing: var(--typography-input-label-field-label-letter-spacing);
  text-align: center;
}
.ats-amplify-chat-clarify-key .ats-icon { display: block; }
.ats-amplify-chat-clarify-key.is-active {
  --_key-bg: var(--amplify-chat-clarify-key-color-background-active);
  --_key-border: var(--amplify-chat-clarify-key-color-border-active);
  --_key-fg: var(--amplify-chat-clarify-key-color-content-number-active);
}
.ats-amplify-chat-clarify-key.is-selected {
  --_key-bg: var(--amplify-chat-clarify-key-color-background-selected);
  --_key-border: var(--amplify-chat-clarify-key-color-border-selected);
  --_key-fg: var(--amplify-chat-clarify-key-color-content-number-selected);
}

/* ==== card/card.css ==== */
/* Card — card / novo-card (Component Migration 311:29059), ported from the
   prototype repo's styles/card.css (.nc-card / .nc-header / .nc-content / .nc-footer).
   Tier-3 card/* tokens. Unencapsulated, namespaced .ats-card. */

.ats-card {
  display: flex; flex-direction: column; align-items: stretch; overflow: clip;
  box-sizing: border-box;
  background: var(--card-color-background-contents);
  border: var(--card-border-width-default) solid var(--card-color-border-default);
  border-radius: var(--card-border-radius-default); box-shadow: var(--elevation-2);
}

/* ---- header ---- */
.ats-card__header {
  position: relative;
  display: flex; align-items: center; gap: var(--card-spacing-header-gap);
  background: var(--card-color-background-header);
  border-bottom: var(--card-border-width-default) solid var(--card-color-border-default);
  padding: var(--card-spacing-header-padding-vertical) var(--card-spacing-header-padding-horizontal);
}
.ats-card__title { flex: 1 0 0; min-width: 0; display: flex; align-items: center; gap: var(--card-spacing-header-gap); }
/* drag gripper (574:5656) — absolute in the header's left padding gutter so it
   doesn't shift the title; shown only while the pointer is over the header. */
.ats-card__gripper {
  position: absolute;
  left: 6px; /* no token: 6px gutter offset (source) */
  top: 20px; /* no token: centers the 16px glyph in the 56px header (source) */
  opacity: 0; cursor: grab; transition: opacity .12s ease;
}
.ats-card__header:hover .ats-card__gripper { opacity: 1; }
.ats-card__title-text {
  margin: 0; color: var(--card-color-content-heading); text-transform: capitalize; white-space: nowrap;
  font-family: var(--typography-title-small-font-family), 'Inter', sans-serif; font-weight: var(--typography-title-small-font-weight);
  font-size: var(--typography-title-small-font-size); line-height: var(--typography-title-small-line-height);
  letter-spacing: var(--typography-title-small-letter-spacing);
}

/* ---- content ---- */
.ats-card__content { display: flex; flex-direction: column; align-items: stretch; background: var(--card-color-background-contents); }
/* padded body layout (source: .nc-content--pad) — put on a body element */
.ats-card__pad {
  display: flex; flex-direction: column;
  gap: var(--card-spacing-content-gap);
  padding: var(--card-spacing-content-padding-vertical) var(--card-spacing-content-padding-horizontal);
}

/* ---- footer: one full-width ats-button (theme="base"), flattened to the source's
   transparent / subtle-hover look ---- */
.ats-card__footer {
  display: flex; background: var(--card-color-background-header);
  border-top: var(--card-border-width-default) solid var(--card-color-border-default);
  padding: var(--card-spacing-footer-padding-vertical) var(--card-spacing-footer-padding-horizontal);
}
.ats-card__footer .ats-btn.ats-btn--base {
  --_bg: transparent;
  --_bg-hover: var(--color-background-subtle);
  --_bg-focus: var(--color-background-subtle);
  --_bg-active: var(--color-background-subtle);
  --_fg: var(--color-text-subtle);
  --_fg-hover: var(--color-text-subtle);
  --_fg-focus: var(--color-text-subtle);
  --_fg-active: var(--color-text-subtle);
  --_sh: none; --_sh-hover: none; --_sh-active: none;
  flex: 1 0 0; gap: var(--card-spacing-footer-gap);
  border-radius: var(--border-radius-sm);
}
.ats-card__footer .ats-btn .ats-icon { background-color: var(--color-icon-illustration); }

/* ==== checkbox/checkbox.css ==== */
/* Checkbox — Figma checkbox atom (250:17814), ported from the prototype repo's
   data-table/Checkbox.astro (.ndt-check in styles/data-table.css), wired to the
   Tier-3 checkbox/* tokens for every state.
   The native input is restyled (appearance: none); the mark is a ::before:
   checked = the icon set's check.svg as a mask, indeterminate = a 2px bar.
   Unencapsulated; namespaced .ats-checkbox. */

.ats-checkbox {
  /* every private var is always defined (never transition a property whose var() can go unset) */
  --_bg: var(--checkbox-color-background-default);
  --_bd: var(--checkbox-color-border-default);
  --_mark: var(--checkbox-color-content-icon-checked);

  appearance: none; -webkit-appearance: none;
  width: 16px; height: 16px; box-sizing: border-box; margin: 0; flex: 0 0 auto;
  display: inline-grid; place-content: center; vertical-align: middle; cursor: pointer;
  background: var(--_bg);
  border: var(--checkbox-border-width-default) solid var(--_bd);
  border-radius: var(--checkbox-border-radius-checkbox);
}
.ats-checkbox::before {
  content: ""; display: block; width: 10px; height: 10px;
  background-color: var(--_mark);
  -webkit-mask: var(--ats-checkbox-check) center / contain no-repeat;
  mask: var(--ats-checkbox-check) center / contain no-repeat;
  visibility: hidden;
}

/* ---- interaction (real + forced via `state`) ---- */
.ats-checkbox:hover, .ats-checkbox.is-hover {
  --_bg: var(--checkbox-color-background-hover);
  --_bd: var(--checkbox-color-border-hover);
}
.ats-checkbox:focus-visible, .ats-checkbox.is-focus {
  --_bg: var(--checkbox-color-background-focus);
  --_bd: var(--checkbox-color-border-focus);
  outline: 0;
  border-width: var(--checkbox-border-width-focus);
}

/* ---- value ---- */
.ats-checkbox:checked {
  --_bg: var(--checkbox-color-background-checked);
  --_bd: var(--checkbox-color-border-checked);
}
.ats-checkbox:checked::before { visibility: visible; }
.ats-checkbox:indeterminate {
  --_bg: var(--checkbox-color-background-indeterminate);
  --_bd: var(--checkbox-color-border-indeterminate);
}
.ats-checkbox:indeterminate::before {
  visibility: visible; width: 8px; height: 2px; border-radius: 1px;
  -webkit-mask: none; mask: none;
}

/* ---- disabled (wins over everything above) ---- */
.ats-checkbox:disabled {
  --_bg: var(--checkbox-color-background-disabled);
  --_bd: var(--checkbox-color-border-disabled);
  --_mark: var(--checkbox-color-content-disabled);
  border-width: var(--checkbox-border-width-default);
  cursor: not-allowed;
}
