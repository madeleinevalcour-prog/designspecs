<div class="ats-list-data-table__tr ats-list-data-table__thead" role="row">
  <span class="ats-list-data-table__cell ats-list-data-table__cell--check" role="columnheader">
    <input class="ats-list-data-table__check" type="checkbox" aria-label="Select all" />
  </span>
  <span class="ats-list-data-table__cell ats-list-data-table__cell--icon" role="columnheader"></span>
  @for (c of cols(); track c.key) {
    <span class="ats-list-data-table__cell ats-list-data-table__cell--col ats-list-data-table__th" role="columnheader">
      <span class="ats-list-data-table__th-label">{{ c.label }}</span>
      <ats-icon name="sortable" [size]="12" color="var(--data-table-color-icon-default)" />
      <ats-icon name="filter" [size]="16" color="var(--data-table-color-icon-default)" />
    </span>
  }
</div>
@for (row of data(); track $index) {
  <div class="ats-list-data-table__tr" role="row">
    <span class="ats-list-data-table__cell ats-list-data-table__cell--check" role="cell">
      <input class="ats-list-data-table__check" type="checkbox" aria-label="Select row" />
    </span>
    <span class="ats-list-data-table__cell ats-list-data-table__cell--icon" role="cell">
      <ats-icon name="preview" [size]="16" color="var(--data-table-color-icon-default)" />
    </span>
    @for (c of cols(); track c.key) {
      <span class="ats-list-data-table__cell ats-list-data-table__cell--col" role="cell">
        <span class="ats-list-data-table__value" [class.ats-list-data-table__value--link]="c.link">{{ row[c.key] }}</span>
      </span>
    }
  </div>
}
