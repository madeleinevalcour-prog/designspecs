<div class="ats-list-header__toolbar">
  <div class="ats-list-header__title">
    <span class="ats-list-header__avatar">
      <ats-icon [name]="avatarIcon()" [size]="24" color="var(--color-icon-icon-knockout)" />
    </span>
    <h1 class="ats-list-header__h1">{{ title() }}</h1>
  </div>
  <div class="ats-list-header__icons">
    @for (a of actionList(); track a.label) {
      <button ats-button theme="icon" [icon]="a.icon" [attr.aria-label]="a.label"></button>
    }
  </div>
  <ats-toggle ariaLabel="Source" [options]="sourceOptions" [(value)]="source" />
</div>

<ats-advanced-search [placeholder]="searchPlaceholder()" (search)="search.emit($event)" />

<div class="ats-list-header__filters">
  <div class="ats-list-header__filter-group">
    @for (f of filterList(); track $index) {
      <button ats-button theme="secondary" [iconLeft]="f.icon" [iconRight]="f.chevron ? 'chevron-down' : undefined">{{ f.label }}</button>
    }
  </div>
  <ats-toggle ariaLabel="View" [options]="viewOptions" [value]="view()" (valueChange)="view.set($any($event))" />
</div>
