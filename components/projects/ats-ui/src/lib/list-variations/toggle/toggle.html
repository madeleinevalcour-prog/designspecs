@for (o of options(); track o.value) {
  <button
    ats-button
    theme="dialogue"
    pill
    class="ats-toggle__seg"
    [iconLeft]="o.icon"
    [state]="o.value === selected() ? 'active' : undefined"
    [attr.aria-pressed]="o.value === selected()"
    [attr.aria-label]="o.label ? null : (o.ariaLabel ?? o.value)"
    [attr.data-value]="o.value"
    (click)="select(o)"
  >{{ o.label }}</button>
}
