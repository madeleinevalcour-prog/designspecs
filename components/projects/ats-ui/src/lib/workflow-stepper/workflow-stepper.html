<button class="ats-wf__more ats-wf__more--left" type="button" aria-label="Scroll workflow left" (click)="scroll(-1)">
  <ats-icon name="previous" [size]="16" color="var(--color-icon-subtle)" />
</button>
<div #row class="ats-wf__items" role="list" [attr.aria-label]="ariaLabel()" (scroll)="update()">
  @for (step of items(); track $index; let last = $last) {
    <ats-workflow-item [label]="step.label" [status]="step.status" [badge]="step.badge" [last]="last" />
  }
</div>
<button class="ats-wf__more ats-wf__more--right" type="button" aria-label="Scroll workflow right" (click)="scroll(1)">
  <ats-icon name="next" [size]="16" color="var(--color-icon-subtle)" />
</button>
