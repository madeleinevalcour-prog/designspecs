<div class="ats-rail__head">
  <div class="ats-rail__logo">
    <ats-icon name="bull" [size]="24" color="var(--bowling-alley-color-logo-icon)" />
    <span class="ats-rail__wordmark">Bullhorn</span>
  </div>
  <button class="ats-rail__toggle" type="button" title="Toggle menu (⌘/Ctrl + B)" aria-label="Toggle menu"
    [attr.aria-expanded]="ctrl.nav() === 'open'" (click)="ctrl.toggleOpen()">
    <ats-icon [name]="toggleIcon()" [size]="14" color="var(--bowling-alley-color-content-icon-default)" />
  </button>
</div>

<ats-main-tabs />
<ats-record-tabs-divider />
<ats-entity-tabs />

<div class="ats-rail__spacer"></div>

<!-- main-tabs-user lives at the foot alongside the utility tabs -->
<div class="ats-rail__section ats-rail__foot">
  <button class="ats-rail-parse" type="button">
    <span class="ats-rail-tab__icon"><ats-icon name="resume" [size]="14" color="var(--bowling-alley-color-content-icon-default)" /></span>
    <span class="ats-rail-tab__label">Parse Resume</span>
  </button>
  <!-- bowling-alley-footer-actions: a row of icon-on-top cells when expanded, stacked icons when collapsed -->
  <div class="ats-rail__foot-actions">
    <button class="ats-rail-foot-item ats-rail-foot-item--utility" type="button" aria-label="Help">
      <span class="ats-rail-tab__icon"><ats-icon name="question" [size]="16" color="var(--bowling-alley-color-content-icon-default)" /></span>
      <span class="ats-rail-tab__label">Help</span>
    </button>
    <button class="ats-rail-foot-item ats-rail-foot-item--utility" type="button" aria-label="Privacy">
      <span class="ats-rail-tab__icon"><ats-icon name="shield-outline" [size]="16" color="var(--bowling-alley-color-content-icon-default)" /></span>
      <span class="ats-rail-tab__label">Privacy</span>
    </button>
    <button class="ats-rail-foot-item ats-rail-tab--user ats-rail-tab--opener" data-overlay="user" type="button"
      [class.is-active]="ctrl.isOpen('user')" [attr.aria-expanded]="ctrl.isOpen('user')" [attr.aria-label]="userName()"
      (click)="ctrl.opener('user', $any($event.currentTarget))">
      <span class="ats-rail-tab__icon"><span class="ats-avatar">{{ userInitials() }}</span></span>
      <span class="ats-rail-tab__label">{{ userName() }}</span>
    </button>
  </div>
</div>
